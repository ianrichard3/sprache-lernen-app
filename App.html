    var focusedId = document.activeElement && document.activeElement.id;
    var draft = state.generator;
    var disabled = draft.busy ? ' disabled' : '';
    var selected = draft.items.filter(function (item) { return item.selected && !item.saved; }).length;
    var collections = state.collections.filter(function (collection) { return !collection.unassigned; });
    draft.collectionIds = draft.collectionIds.filter(function (id) { return !!collectionById_(id); });
    var destinations = collections.map(function (collection) {
      return '<label><input type="checkbox" id="generator-collection-' + esc(collection.id) + '" data-generator-collection value="' + esc(collection.id) + '"' +
        (draft.collectionIds.indexOf(collection.id) !== -1 ? ' checked' : '') + disabled + '> ' + esc(collection.name) + '</label>';
    }).join('');
    var rows = draft.items.map(function (item, index) {
      var locked = draft.busy || item.saved ? ' disabled' : '';
      return '<article class="panel" style="margin-top:12px"><label><input type="checkbox" id="generator-select-' + index + '" data-generator-select="' + index + '"' +
        (item.selected ? ' checked' : '') + locked + '> Frase ' + (index + 1) + '</label>' +
        (item.saved ? '<p role="status">' + (item.reused ? 'Agregada usando la frase existente; se conservó su traducción y progreso.' : 'Agregada.') + '</p>' : '') +
        '<div class="field"><label for="generated-de-' + index + '">Alemán</label><textarea id="generated-de-' + index + '" data-generator-field="de" data-index="' + index + '"' + locked + '>' + esc(item.de) + '</textarea></div>' +
        '<div class="field"><label for="generated-es-' + index + '">Español</label><textarea id="generated-es-' + index + '" data-generator-field="es" data-index="' + index + '"' + locked + '>' + esc(item.es) + '</textarea></div></article>';
    }).join('');
    el.screen.innerHTML = '<section style="max-width:800px;margin:auto"><h1 class="section-title">Generar frases</h1>' +
      '<p class="hint">10 frases en alemán B1–B2 con traducción natural al español. Revisalas antes de agregarlas.</p>' +
      '<div class="field"><label for="generator-context">Situación o temática</label><textarea id="generator-context" placeholder="Por ejemplo: pedir ayuda con un bug"' + disabled + '>' + esc(draft.context) + '</textarea></div>' +
      '<button class="primary" data-act="generate-phrases"' + disabled + '>' + (draft.items.length ? 'Generar otra tanda' : 'Generar frases') + '</button>' +
      '<p role="status" aria-live="polite">' + (draft.busy ? 'Procesando…' : '') + '</p>' +
      (draft.items.length ? '<div class="panel"><h2 class="section-title">Colecciones de destino</h2><p class="hint">Las frases seleccionadas se agregan a todas las colecciones que marques.</p>' +
        (destinations ? '<div class="collection-picker">' + destinations + '</div>' : '<p>Creá una colección en Colecciones y volvé. Tu borrador se conserva mientras no recargues la app.</p>') +
        '<div class="form-actions"><button class="ghost" data-act="generator-select-all"' + disabled + '>Seleccionar todas</button><button class="ghost" data-act="generator-select-none"' + disabled + '>Deseleccionar todas</button>' +
        '<button class="primary" data-act="save-generated"' + (draft.busy || !selected || !draft.collectionIds.length ? ' disabled' : '') + '>Agregar seleccionadas (' + selected + ')</button></div></div>' + rows : '') + '</section>';
    var focused = focusedId && document.getElementById(focusedId);
    if (focused && !focused.disabled) focused.focus();
  }

  function generatePhrases_() {
    var draft = state.generator;
    if (draft.busy) return;
    if (!draft.context.trim()) return say('Escribí una situación o temática.', 'err');
    if (draft.items.some(function (item) { return !item.saved; }) && !confirm('¿Descartar los borradores sin guardar cuando esté lista la nueva tanda?')) return;
    draft.busy = true;
    renderGenerator();
    google.script.run.withSuccessHandler(function (items) {
      draft.items = items.map(function (item) { return { de:item.de, es:item.es, selected:false, saved:false }; });
      draft.busy = false;
      if (state.view === 'generate') renderGenerator();
      say('10 frases listas para revisar.');
    }).withFailureHandler(function (err) {
      draft.busy = false;
      if (state.view === 'generate') renderGenerator();
      say(err.message, 'err');
    }).generatePhrases(draft.context);
  }

  function saveGeneratedPhrases_() {
    var draft = state.generator;
    if (draft.busy) return;
    if (state.loadingData) return say('Esperá a que termine la actualización antes de guardar.', 'err');
    var selected = draft.items.filter(function (item) { return item.selected && !item.saved; });
    if (!selected.length || !draft.collectionIds.length) return say('Elegí frases y al menos una colección.', 'err');
    if (selected.some(function (item) { return !item.de.trim() || !item.es.trim(); })) return say('Completá el alemán y español de las frases seleccionadas.', 'err');
    draft.busy = true;
    draft.saving = true;
    renderGenerator();
    google.script.run.withSuccessHandler(function (data) {
      data.results.forEach(function (result, index) {
        var existing = byId(result.item.id);
        if (existing) state.items[state.items.indexOf(existing)] = result.item;
        else state.items.unshift(result.item);
        setPhraseCollectionIds_(result.item.id, result.collectionIds);
        selected[index].saved = true;
        selected[index].reused = result.reused;
        selected[index].de = result.item.de;
        selected[index].es = result.item.es;
      });
      draft.busy = false;
      draft.saving = false;
      decorateCollections_();
      if (state.collectionId) state.collection = localCollection_(state.collectionId);
      // Conservá formularios y material editado; el backend valida la firma del material al descargar.
      if (state.view === 'generate') renderGenerator();
      say('Frases agregadas a las colecciones elegidas.');
    }).withFailureHandler(function (err) {
      draft.busy = false;
      draft.saving = false;
      if (state.view === 'generate') renderGenerator();
      say(err.message, 'err');
    }).saveGeneratedPhrases({ items:selected.map(function (item) { return { de:item.de, es:item.es }; }), collectionIds:draft.collectionIds.slice() });
  }

  function renderEtymology() {
    var result = state.etymologyResult;
    el.screen.innerHTML = '<section class="panel form-panel" style="max-width:720px"><div class="section-head"><h1 class="section-title">Etimología</h1></div>' +
      '<p class="hint">Analizá una palabra o frase sin guardarla en tu registro.</p>' +
      '<div class="field"><label for="etymology-source">Palabra o frase</label><textarea id="etymology-source" placeholder="zum Beispiel: verstehen">' + esc(state.etymologyText) + '</textarea></div>' +
      '<div class="ai-actions"><button id="ai-etymology" class="ghost" data-act="etymology">Analizar etimología</button></div>' +
      '<div id="ai-etymology-result" class="ai-result" role="status" aria-live="polite"' + (result ? '' : ' hidden') + '>' + esc(result) + '</div></section>';
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav'), function (button) {
      button.className = 'nav' + (button.dataset.view === state.view ? ' on' : '');
    });
    if (state.view === 'study') renderStudy(); else if (state.view === 'collections') renderCollections(); else if (state.view === 'manage') renderManage(); else if (state.view === 'print') renderPrint(); else if (state.view === 'generate') renderGenerator(); else renderEtymology();
  }

  function openCollection(id) {
    stopPlayer_();
    var collection = localCollection_(id);
    if (!collection) return say('No existe la colección seleccionada.', 'err');
    state.collectionId = id;
    state.collection = collection;
    state.collectionEditor = null;
    state.collectionPhraseDraft = false;
    state.collectionSelection = {};
    player.index = 0;
    player.repetition = 0;
    state.session.controlsOpen = true;
    resetSession_('free', 'manual', true);
    render();
  }

  function saveCollection() {
    var input = document.getElementById('collection-name');
    var name = input && input.value;
    if (!String(name || '').trim()) return say('Escribí un nombre para la colección.', 'err');
    if (state.collectionEditor === 'new') {
      google.script.run.withSuccessHandler(function (collection) {
        clearPrintResult_();
        state.collections.push(collection);
        state.memberIdsByCollection[collectionKey_(collection.id)] = [];
        decorateCollections_();
        state.collectionEditor = null;
        openCollection(collection.id);
      }).withFailureHandler(function (err) { say(err.message, 'err'); }).createCollection({ name:name });
      return;
    }
    google.script.run.withSuccessHandler(function (collection) {
      clearPrintResult_();
      var current = collectionById_(collection.id);
      if (current) current.name = collection.name;
      decorateCollections_();
      refreshOpenCollection_();
      render();
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).renameCollection({ id:state.collectionId, name:name });
  }

  function deleteCurrentCollection() {
    var collection = state.collection && state.collection.collection;
    if (!collection || collection.unassigned || !confirm('Borrar la colección "' + collection.name + '"? Las frases se conservan.')) return;
    stopPlayer_();
    google.script.run.withSuccessHandler(function () {
      clearPrintResult_();
      delete state.memberIdsByCollection[collectionKey_(collection.id)];
      state.collections = state.collections.filter(function (item) { return item.id !== collection.id; });
      state.printCollectionIds = state.printCollectionIds.filter(function (id) { return collectionKey_(id) !== collectionKey_(collection.id); });
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      decorateCollections_();
      render();
      say('Colección borrada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).deleteCollection(collection.id);
  }

  function changeCollectionPhrase(action, id, direction) {
    var collectionId = state.collectionId;
    if (!collectionId) return;
    var runner = google.script.run.withSuccessHandler(function (result) {
      clearPrintResult_();
      state.memberIdsByCollection[collectionKey_(result.collectionId)] = result.phraseIds;
      decorateCollections_();
      refreshOpenCollection_();
      render();
    }).withFailureHandler(function (err) { say(err.message, 'err'); });
    if (action === 'remove') runner.removeCollectionPhrase({ collectionId:collectionId, phraseId:id });
    else runner.moveCollectionPhrase({ collectionId:collectionId, phraseId:id, direction:direction });
  }

  function addSelectedCollectionPhrases() {
    var phraseIds = selectedCollectionCandidateIds_();
    if (!state.collectionId || !phraseIds.length) return;
    google.script.run.withSuccessHandler(function (result) {
      clearPrintResult_();
      state.memberIdsByCollection[collectionKey_(result.collectionId)] = result.phraseIds;
      state.collectionSelection = {};
      decorateCollections_();
      refreshOpenCollection_();
      render();
      say(result.addedIds.length + ' frases agregadas' + (result.skippedIds.length ? '; ' + result.skippedIds.length + ' ya estaban en la colección.' : '.'));
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).addCollectionPhrases({
      collectionId:state.collectionId,
      phraseIds:phraseIds
    });
  }

  function openStudy(id) {
    if (!byId(id)) return;
    state.studyTab = 'phrases';
    state.detailId = id;
    state.revealed = false;
    render();
  }

  function recordResult(correct) {
    if (!state.detailId || state.saving) return;
    state.saving = true;
    render();
    google.script.run.withSuccessHandler(function (data) {
      state.history = data.history;
      state.saving = false;
      state.detailId = null;
      state.revealed = false;
      render();
      say(correct ? 'Marcada como bien.' : 'Marcada como mal.');
    }).withFailureHandler(function (err) {
      state.saving = false;
      render();
      say(err.message, 'err');
    }).recordStudy(state.detailId, correct);
  }

  function savePhrase() {
    var id = state.editing || '';
    var collectionIds = state.collectionPhraseDraft ? [state.collectionId] : Array.prototype.map.call(
      document.querySelectorAll('input[name="phrase-collection"]:checked'), function (input) { return input.value; }
    );
    var payload = { id:id, de:document.getElementById('f-de').value, es:document.getElementById('f-es').value,
      notes:document.getElementById('f-notes').value, tags:document.getElementById('f-tags').value,
      expectedUpdated:id && byId(id) ? byId(id).updated : '', expectedCollectionIds:id ? (state.editingCollectionIds || []) : [], collectionIds:collectionIds };
    if (!payload.de.trim()) return say('Escribí la frase en alemán antes de guardar.', 'err');
    var fromCollection = state.collectionPhraseDraft;
    google.script.run.withSuccessHandler(function (result) {
      clearPrintResult_();
      var item = result.item;
      if (id) state.items[state.items.indexOf(byId(id))] = item; else state.items.unshift(item);
      setPhraseCollectionIds_(item.id, result.collectionIds);
      decorateCollections_();
      if (state.collectionId) refreshOpenCollection_();
      if (fromCollection) {
        state.collectionPhraseDraft = false;
        state.collectionSelection = {};
      } else { state.editing = null; state.editingCollectionIds = null; }
      render();
      say(id ? 'Cambios guardados.' : 'Frase agregada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).savePhrase(payload);
  }

  function restoreAiButton(button, label) {
    if (!document.body.contains(button)) return;
    button.disabled = false;
    button.textContent = label;
  }

  function translateToGerman() {
    var source = document.getElementById('f-es');
    var button = document.getElementById('ai-translate');
    if (!source || !button) return;
    if (!source.value.trim()) return say('Escribí la frase en español antes de traducir.', 'err');
    button.disabled = true;
    button.textContent = 'Traduciendo…';
    google.script.run.withSuccessHandler(function (translation) {
      if (document.body.contains(button)) {
        var target = document.getElementById('f-de');
        if (target) target.value = translation;
      }
      restoreAiButton(button, 'Traducir al alemán');
      say('Propuesta en alemán lista.');
    }).withFailureHandler(function (err) {
      restoreAiButton(button, 'Traducir al alemán');
      say(err.message, 'err');
    }).suggestGermanTranslation(source.value);
  }

  function translateToSpanish() {
    var source = document.getElementById('f-de');
    var button = document.getElementById('ai-translate-to-es');
    if (!source || !button) return;
    if (!source.value.trim()) return say('Escribí la frase en alemán antes de traducir.', 'err');
    button.disabled = true;
    button.textContent = 'Traduciendo…';
    google.script.run.withSuccessHandler(function (translation) {
      if (document.body.contains(button)) {
        var target = document.getElementById('f-es');
        if (target) target.value = translation;
      }
      restoreAiButton(button, 'Traducir al español');
      say('Propuesta en español lista.');
    }).withFailureHandler(function (err) {
      restoreAiButton(button, 'Traducir al español');
      say(err.message, 'err');
    }).suggestSpanishTranslation(source.value);
  }

  function showEtymology() {
    var source = document.getElementById('etymology-source');
    var button = document.getElementById('ai-etymology');
    var result = document.getElementById('ai-etymology-result');
    if (!source || !button || !result) return;
    if (!source.value.trim()) return say('Escribí la palabra o frase en alemán antes de analizarla.', 'err');
    state.etymologyText = source.value;
    state.etymologyResult = '';
    button.disabled = true;
    button.textContent = 'Analizando…';
    result.hidden = false;
    result.textContent = 'Analizando etimología…';
    google.script.run.withSuccessHandler(function (text) {
      state.etymologyResult = text;
      if (document.body.contains(result)) result.textContent = text;
      restoreAiButton(button, 'Analizar etimología');
    }).withFailureHandler(function (err) {
      if (document.body.contains(result)) {
        result.hidden = true;
        result.textContent = '';
      }
      restoreAiButton(button, 'Analizar etimología');
      say(err.message, 'err');
    }).analyzeEtymology(source.value);
  }

  function removePhrase(id) {
    var item = byId(id);
    if (!item || !confirm('Borrar ' + id + '? Se elimina la fila de la hoja.')) return;
    google.script.run.withSuccessHandler(function (data) {
      clearPrintResult_();
      state.items = state.items.filter(function (item) { return item.id !== id; });
      state.history = data.history;
      Object.keys(state.memberIdsByCollection).forEach(function (key) {
        state.memberIdsByCollection[key] = state.memberIdsByCollection[key].filter(function (phraseId) { return phraseId !== id; });
      });
      decorateCollections_();
      if (state.collectionId) refreshOpenCollection_();
      if (state.editing === id) { state.editing = null; state.editingCollectionIds = null; }
      render();
      say('Frase ' + id + ' borrada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).deletePhrase({ id:id, expectedUpdated:item.updated });
  }

  function importSettings() {
    var delimiter = document.querySelector('input[name="delimiter"]:checked');
    return { text:document.getElementById('import-text').value, delimiter:delimiter && delimiter.value === 'tab' ? '\t' : ',',
      hasHeader:document.getElementById('import-header').checked };
  }

  function previewImport() {
    var settings = importSettings();
    state.importText = settings.text;
    state.importHasHeader = settings.hasHeader;
    state.importDelimiter = settings.delimiter;
    google.script.run.withSuccessHandler(function (data) {
      if (!data.columnCount) return say('No se encontraron columnas para importar.', 'err');
      state.importPreview = { data:data, text:settings.text, delimiter:settings.delimiter };
      render();
      var de = document.getElementById('import-de');
      var es = document.getElementById('import-es');
      if (de) de.value = '0';
      if (es) es.value = data.columnCount > 1 ? '1' : '0';
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).previewImport(settings.text, settings.delimiter);
  }

  function importPhrases() {
    var settings = importSettings();
    var preview = state.importPreview;
    if (!preview || preview.text !== settings.text || preview.delimiter !== settings.delimiter) {
      return say('Actualizá la vista previa antes de importar.', 'err');
    }
    var payload = { text:settings.text, delimiter:settings.delimiter, hasHeader:settings.hasHeader,
      deColumn:Number(document.getElementById('import-de').value), esColumn:Number(document.getElementById('import-es').value) };
    google.script.run.withSuccessHandler(function (result) {
      state.importText = '';
      state.importPreview = null;
      state.importHasHeader = true;
      state.importDelimiter = ',';
      clearPrintResult_();
      state.items = (result.items || []).concat(state.items);
      decorateCollections_();
      render();
      say(result.imported + ' importadas; ' + result.duplicate + ' duplicadas y ' + result.empty + ' vacías omitidas.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).importPhrases(payload);
  }

  function reload(done, preservePrint) {
    if (state.generator.saving) return say('Esperá a que termine el guardado antes de actualizar.', 'err');
    if (state.loadingData) return;
    state.loadingData = true;
    google.script.run.withSuccessHandler(function (data) {
      state.loadingData = false;
      applyAppData_(data);
      if (!preservePrint) clearPrintResult_();
      if (done) done(); else render();
    }).withFailureHandler(function (err) {
      state.loadingData = false;
      say(err.message, 'err');
    }).loadAppData();
  }

  el.app.addEventListener('click', function (event) {
    var button = event.target.closest('[data-act]');
    if (!button) return;
    var act = button.dataset.act;
    if (act === 'generate-phrases') return generatePhrases_();
    if (act === 'save-generated') return saveGeneratedPhrases_();
    if (act === 'generator-select-all' || act === 'generator-select-none') {
      if (state.generator.busy) return;
      state.generator.items.forEach(function (item) { if (!item.saved) item.selected = act === 'generator-select-all'; });
      return renderGenerator();
    }
    if (act === 'refresh-data') {
      if (state.view === 'print') capturePrintPreview_();
      stopPlayer_();
      say('Actualizando datos…');
      return reload(function () {
        if (state.collectionId) refreshOpenCollection_();
        render();
        say('Datos actualizados.');
      });
    }
    if (act === 'select-all-print-collections') return selectAllPrintCollections_();
    if (act === 'clear-print-collections') return clearPrintCollections_();
    if (act === 'move-print-collection') return movePrintCollection_(Number(button.dataset.index), Number(button.dataset.direction));
    if (act === 'preview-material') return previewPrintMaterial_();
    if (act === 'generate-material') return generatePrintMaterial_();
    if (act === 'switch-view') {
      if (state.view === 'print') capturePrintPreview_();
      stopPlayer_();
      state.view = button.dataset.view;
      state.detailId = null;
      state.editing = null;
      state.editingCollectionIds = null;
      state.collectionPhraseDraft = false;
      return render();
    }
    if (act === 'open-collection') return openCollection(button.dataset.id);
    if (act === 'collection-back') {
      stopPlayer_();
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      state.collectionPhraseDraft = false;
      state.collectionSelection = {};
      return render();
    }
    if (act === 'new-collection') { stopPlayer_(); state.collectionId = null; state.collection = null; state.collectionEditor = 'new'; state.collectionEditorPage = 1; state.collectionCandidatePage = 1; state.collectionSelection = {}; return render(); }
    if (act === 'edit-collection') { stopPlayer_(); state.collectionEditor = state.collectionId; state.collectionPhraseQuery = ''; state.collectionEditorPage = 1; state.collectionCandidatePage = 1; state.collectionSelection = {}; return render(); }
    if (act === 'cancel-collection-editor') {
      state.collectionPhraseQuery = '';
      state.collectionSelection = {};
      state.collectionPhraseDraft = false;
      if (state.collectionEditor === 'new') { state.collectionEditor = null; return render(); }
      state.collectionEditor = null;
      return render();
    }
    if (act === 'new-collection-phrase') { stopPlayer_(); state.collectionEditor = state.collectionId; state.collectionPhraseDraft = true; return renderCollections(); }
    if (act === 'cancel-collection-phrase') { state.collectionPhraseDraft = false; return renderCollections(); }
    if (act === 'save-collection') return saveCollection();
    if (act === 'delete-collection') return deleteCurrentCollection();
    if (act === 'add-selected-collection-phrases') return addSelectedCollectionPhrases();
    if (act === 'remove-collection-phrase') return changeCollectionPhrase('remove', button.dataset.id);
    if (act === 'move-collection-phrase') return changeCollectionPhrase('move', button.dataset.id, Number(button.dataset.direction));
    if (act === 'set-phase') return setPhase_(button.dataset.phase);
    if (act === 'select-session-item') return selectSessionItem_(Number(button.dataset.index));
    if (act === 'player-row-toggle') return toggleSessionItem_(Number(button.dataset.index));
    if (act === 'toggle-session-controls') { state.session.controlsOpen = !state.session.controlsOpen; return renderCollections(); }
    if (act === 'toggle-support') return toggleSupport_(button.dataset.support);
    if (act === 'player-toggle') return togglePlayer_();
    if (act === 'player-previous') return movePlayer_(-1);
    if (act === 'player-next') return movePlayer_(1);
    if (act === 'player-restart') return restartPlayer_();
    if (act === 'player-restart-list') return restartSession_();
    if (act === 'copy-session-ssml') return copySessionSsml_();
    if (act === 'study-tab') { state.studyTab = button.dataset.tab; return render(); }
    if (act === 'study') return openStudy(button.dataset.id);
    if (act === 'back-study') { state.detailId = null; state.revealed = false; return render(); }
    if (act === 'reveal') { state.revealed = true; return render(); }
    if (act === 'result') return recordResult(button.dataset.correct === 'true');
    if (act === 'random') {
      var item = randomCandidate(state.items, state.history);
      if (item) return openStudy(item.id);
      state.studyTab = 'history';
      render();
      say('Todas las frases están entre las últimas 20. Repasá una desde el historial.', 'err');
      return;
    }
    if (act === 'new') { state.editing = ''; state.editingCollectionIds = []; return render(); }
    if (act === 'edit') { state.view = 'manage'; state.detailId = null; state.editing = button.dataset.id; state.editingCollectionIds = collectionIdsForPhrase_(state.editing); return render(); }
    if (act === 'cancel-editor') { state.editing = null; state.editingCollectionIds = null; return render(); }
    if (act === 'save-phrase') return savePhrase();
    if (act === 'translate') return translateToGerman();
    if (act === 'translate-to-es') return translateToSpanish();
    if (act === 'etymology') return showEtymology();
    if (act === 'page') {
      var pageKey = button.dataset.list === 'manage' ? 'managePage' : button.dataset.list === 'collection' ? 'collectionPage' : button.dataset.list === 'collection-editor' ? 'collectionEditorPage' : button.dataset.list === 'collection-candidates' ? 'collectionCandidatePage' : 'studyPage';
      state[pageKey] += Number(button.dataset.direction);
      if (button.dataset.list === 'manage') return renderManageList();
      if (button.dataset.list === 'collection' || button.dataset.list === 'collection-editor' || button.dataset.list === 'collection-candidates') return renderCollections();
      return renderStudyList();
    }
    if (act === 'delete') return removePhrase(button.dataset.id);
    if (act === 'copy') {
      var text = phrasesToText(managedItems());
      if (!text) return say('No hay frases visibles para copiar.', 'err');
      return copyText(text).then(function () { say('Frases copiadas.'); }).catch(function () { say('No se pudo copiar el texto.', 'err'); });
    }
    if (act === 'preview-import') return previewImport();
    if (act === 'import') return importPhrases();
  });

  el.app.addEventListener('input', function (event) {
    if (event.target.id === 'generator-context') state.generator.context = event.target.value;
    else if (event.target.matches('[data-generator-field]')) state.generator.items[Number(event.target.dataset.index)][event.target.dataset.generatorField] = event.target.value;
    else if (event.target.id === 'manage-search') { state.manageQuery = event.target.value; state.managePage = 1; renderManageList(); }
    else if (event.target.id === 'study-search') { state.studyQuery = event.target.value; state.studyPage = 1; renderStudyList(); }
    else if (event.target.id === 'import-text') state.importText = event.target.value;
    else if (event.target.id === 'etymology-source') state.etymologyText = event.target.value;
    else if (event.target.id === 'collection-search') {
      var collectionCursor = event.target.selectionStart;
      state.collectionQuery = event.target.value;
      renderCollections();
      var collectionSearch = document.getElementById('collection-search');
      if (collectionSearch) { collectionSearch.focus(); collectionSearch.setSelectionRange(collectionCursor, collectionCursor); }
    } else if (event.target.id === 'collection-phrase-search') {
      var phraseCursor = event.target.selectionStart;
      state.collectionPhraseQuery = event.target.value;
      state.collectionCandidatePage = 1;
      renderCollections();
      var phraseSearch = document.getElementById('collection-phrase-search');
      if (phraseSearch) { phraseSearch.focus(); phraseSearch.setSelectionRange(phraseCursor, phraseCursor); }
    }
  });
  el.app.addEventListener('change', function (event) {
    if (event.target.matches('[data-generator-select]')) {
      state.generator.items[Number(event.target.dataset.generatorSelect)].selected = event.target.checked;
      return renderGenerator();
    } else if (event.target.matches('[data-generator-collection]')) {
      if (event.target.checked) state.generator.collectionIds.push(event.target.value);
      else state.generator.collectionIds = state.generator.collectionIds.filter(function (id) { return id !== event.target.value; });
      return renderGenerator();
    } else if (event.target.matches('[data-print-status]')) {
      return setPrintStatus_(event.target.dataset.id, event.target.checked);
    } else if (event.target.matches('[data-print-collection]')) {
      var collectionId = event.target.value;
      if (event.target.checked && !printCollectionSelected_(collectionId)) state.printCollectionIds.push(collectionId);
      if (!event.target.checked) state.printCollectionIds = state.printCollectionIds.filter(function (id) { return collectionKey_(id) !== collectionKey_(collectionId); });
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.name === 'print-scope') {
      state.printScope = event.target.value;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.name === 'print-format') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printFormat = event.target.value;
      return renderPrint();
    } else if (event.target.id === 'print-order') {
      state.printOrder = event.target.value;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.id === 'print-only-unprinted') {
      state.printOnlyUnprinted = event.target.checked;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.id === 'print-font-size') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printFontSize = Number(event.target.value);
      return renderPrint();
    } else if (event.target.id === 'print-line-height') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printLineHeight = Number(event.target.value);
      return renderPrint();
    } else if (event.target.matches('[data-collection-candidate]')) {
      state.collectionSelection[event.target.value] = event.target.checked;
      renderCollections();
    } else if (event.target.id === 'import-header') state.importHasHeader = event.target.checked;
    else if (event.target.id === 'session-phase') setPhase_(event.target.value);
    else if (event.target.id === 'session-order') setSessionOrder_(event.target.value);
    else if (event.target.id === 'player-rate') setPlayerSetting_('rate', event.target.value);
    else if (event.target.id === 'player-pause') setPlayerSetting_('pause', event.target.value);
    else if (event.target.id === 'player-reps') setPlayerSetting_('reps', event.target.value);
  });
  if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', updatePlayerUi_);
  } else if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = updatePlayerUi_;
  }
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.detailId) { state.detailId = null; state.revealed = false; render(); }
    else if (event.key === 'Escape' && state.editing !== null) { state.editing = null; state.editingCollectionIds = null; render(); }
    else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && (state.editing !== null || state.collectionPhraseDraft)) { event.preventDefault(); savePhrase(); }
  });

  el.screen.innerHTML = '<div class="empty">Cargando frases…</div>';
  reload();
}());
</script>
</body>
</html>
