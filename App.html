<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#16202b; --paper:#fff; --surface:#f6f8fa; --rule:#dfe5ec; --muted:#64748b; --good:#0f766e; --good-soft:#e2f2f0; --danger:#b3261e; --focus:#2563eb; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--surface); color:var(--ink); }
  body { font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:7px 11px; }
  button:focus-visible,input:focus,textarea:focus,select:focus { outline:2px solid var(--focus); outline-offset:1px; }
  button:disabled { cursor:not-allowed; opacity:.55; }
  input[type="text"],input[type="search"],textarea,select { width:100%; padding:8px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); }
  textarea { min-height:72px; resize:vertical; }
  #app { min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { font-weight:750; letter-spacing:-.01em; white-space:nowrap; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  .nav { background:transparent; color:var(--muted); font-weight:650; }
  .nav.on,.primary { background:var(--ink); color:#fff; font-weight:650; }
  .nav.on:hover,.primary:hover { background:#0d1620; }
  .screen { max-width:1180px; margin:0 auto; padding:20px; }
  .ghost { background:var(--paper); color:var(--ink); border-color:var(--rule); }
  .ghost:hover { background:var(--surface); }
  .link { padding:3px 5px; background:transparent; color:var(--muted); text-decoration:underline; }
  .link:hover { color:var(--ink); }
  .danger { color:var(--danger); }
  .muted,.hint { color:var(--muted); }
  .hint { margin:5px 0 0; font-size:12px; }
  .section-title { margin:0; font-size:16px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .card,.panel { background:var(--paper); border:1px solid var(--rule); border-radius:9px; }
  .empty { padding:36px 16px; color:var(--muted); text-align:center; }
  .manage-list { overflow:hidden; }
  .pagination { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 14px; border-top:1px solid var(--rule); }
  .pagination .muted { margin-right:auto; font-size:12px; }
  .pronunciation { display:block; margin:4px 0 10px; color:var(--muted); white-space:pre-wrap; font-size:15px; }
  .form-actions { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  .manage-grid { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
  .manage-item { padding:14px 16px; border-bottom:1px solid var(--rule); }
  .manage-item h3 { margin:0; font:17px/1.3 Georgia,"Times New Roman",serif; }
  .manage-item p { margin:3px 0 0; color:var(--muted); }
  .manage-meta { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { border:1px solid var(--rule); border-radius:999px; color:var(--muted); padding:1px 7px; font-size:11px; }
  .print-status { display:flex; align-items:center; gap:5px; margin:0 4px 0 0; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; }
  .manage-side { display:grid; gap:20px; }
  .form-panel,.import-panel { padding:16px; }
  .field { margin-bottom:12px; }
  .ai-actions { display:flex; gap:8px; margin-top:7px; }
  .ai-result { margin:8px 0 0; padding:10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); white-space:pre-wrap; }
  label { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
  .import-options { display:flex; gap:14px; margin:9px 0; color:var(--muted); flex-wrap:wrap; }
  .import-options label { display:flex; align-items:center; gap:5px; margin:0; font-size:12px; letter-spacing:0; text-transform:none; }
  .mapping { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .preview { margin-top:12px; overflow-x:auto; }
  .collection-list { overflow:hidden; }
  .collection-choice { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border-bottom:1px solid var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .collection-choice:last-child { border-bottom:0; }
  .collection-choice:hover { background:var(--surface); }
  .collection-count { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
  .collection-picker { display:grid; gap:6px; max-height:180px; overflow:auto; padding:8px; border:1px solid var(--rule); border-radius:6px; }
  .collection-picker label { display:flex; align-items:center; gap:7px; margin:0; color:var(--ink); font-size:13px; font-weight:400; letter-spacing:0; text-transform:none; }
  .print-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start; }
  .print-panel { padding:16px; }
  .print-options { display:grid; gap:8px; }
  .print-option,.print-collection-row { display:flex; align-items:center; gap:8px; margin:0; color:var(--ink); font-size:14px; font-weight:400; letter-spacing:0; text-transform:none; }
  .print-option input,.print-collection-row input { width:auto; }
  .print-collection-list { overflow:hidden; margin-top:10px; }
  .print-collection-row { padding:10px 12px; border-bottom:1px solid var(--rule); }
  .print-collection-row:last-child { border-bottom:0; }
  .print-collection-row span:first-of-type { flex:1; }
  .print-order-list { display:grid; gap:6px; margin-top:10px; }
  .print-order-row { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); }
  .print-order-row span { flex:1; }
  .print-order-actions { display:flex; gap:3px; }
  .print-summary { margin:14px 0; padding:10px; border-radius:6px; background:var(--surface); color:var(--muted); }
  .print-settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .print-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .print-result { margin-top:16px; padding:12px; border:1px solid var(--rule); border-radius:7px; background:var(--good-soft); color:var(--good); }
  .print-result a { display:inline-block; margin-top:5px; color:inherit; font-weight:700; }
  .print-preview { margin-top:20px; }
  .print-preview-content { min-height:180px; max-height:720px; overflow:auto; padding:24px; border:1px solid var(--rule); border-radius:7px; background:#fff; color:#111; font-family:Georgia,"Times New Roman",serif; font-size:var(--material-size); line-height:var(--material-leading); }
  .print-preview-content:focus { outline:2px solid var(--focus); outline-offset:1px; }
  .print-preview-content h1 { margin:0 0 .25em; font-size:1.45em; line-height:1.15; }
  .print-preview-content h2 { margin:1.5em 0 .45em; font-size:1.1em; line-height:1.2; }
  .print-preview-content .material-meta { margin:0 0 1.5em; color:var(--muted); font: .65em/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .print-preview-content table { width:100%; border-collapse:collapse; table-layout:fixed; margin:0 0 1.4em; }
  .print-preview-content th,.print-preview-content td { padding:.65em .6em; border:1px solid #777; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
  .print-preview-content th { background:#eee; font:.72em/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .print-preview-content [data-pronunciation-field] { display:block; min-height:1em; white-space:pre-wrap; }
  .print-preview-content [data-pronunciation-field]:empty::before { content:attr(data-placeholder); color:var(--muted); font-size:.7em; }
  .print-preview-content tr { break-inside:avoid; page-break-inside:avoid; }
  @media (max-width:760px) { .print-settings { grid-template-columns:1fr; } .print-preview-content { padding:16px; } }
  [hidden] { display:none !important; }
  summary { cursor:pointer; font-weight:650; }
  details[open] > summary { margin-bottom:12px; }
  .collection-filter { margin:12px 0; }
  .collection-title { flex:1; }
  .tool-nav { margin-bottom:20px; }
  .practice-options { display:flex; align-items:flex-end; gap:12px; margin:12px 0; }
  .practice-options > input { flex:1; }
  .ssml-settings { display:flex; gap:12px; margin-top:12px; }
  .session-list { overflow:hidden; margin-top:16px; }
  .session-list-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:13px 14px; border-bottom:1px solid var(--rule); }
  .session-language-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .session-choice { display:block; width:100%; padding:13px 14px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .session-choice:hover,.session-choice.revealed { background:var(--surface); }
  .session-row-de { display:block; font:18px/1.35 Georgia,"Times New Roman",serif; }
  .session-row-es { display:block; margin-top:3px; color:var(--muted); font-size:14px; }
  .session-row-meta { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { padding:5px 6px; border:1px solid var(--rule); text-align:left; vertical-align:top; }
  #note { position:fixed; left:50%; bottom:18px; display:none; max-width:min(90vw,600px); padding:9px 13px; border-radius:7px; transform:translateX(-50%); box-shadow:0 4px 16px rgba(15,23,42,.16); }
  #note.show { display:block; }
  #note.ok { background:var(--good-soft); color:var(--good); }
  #note.err { background:#fdecea; color:var(--danger); }
  @media (max-width:760px) { .topbar { padding:10px 14px; flex-wrap:wrap; gap:8px; } .screen { padding:14px; } .manage-grid,.print-grid { grid-template-columns:1fr; } .manage-side { order:-1; } .practice-options { flex-wrap:wrap; } .practice-options > input { flex-basis:100%; } .collection-choice { flex-wrap:wrap; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Sprache Lernen App</div>
    <nav aria-label="Secciones">
      <button class="nav" data-act="switch-view" data-view="manage">Todas las Frases</button>
      <button class="nav" data-act="switch-view" data-view="collections">Colecciones</button>
      <button class="nav" data-act="switch-view" data-view="practice">Estudiar Frases</button>
      <button class="nav" data-act="switch-view" data-view="tools">Herramientas</button>
      <button class="nav" data-act="switch-view" data-view="settings">Configuración</button>
    </nav>
    <button class="link" data-act="refresh-data">Actualizar datos</button>
  </header>
  <main class="screen">
    <nav class="tool-nav" id="tool-nav" aria-label="Herramientas" hidden>
      <button class="ghost" data-act="switch-view" data-view="print">Preparar material para imprimir</button>
      <button class="ghost" data-act="switch-view" data-view="generate">Generar frases con IA</button>
      <button class="ghost" data-act="switch-view" data-view="etymology">Explorar la etimología</button>
    </nav>
    <div id="screen"></div>
  </main>
  <div id="note" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    loadingData: false, writingData:false,
    setup: null, language: {name:'alemán', locale:'de-DE', translation:{name:'español', locale:'es-ES'}, version:0}, languageChoice:'de-DE', customName:'', customLocale:'', configSaving:false, languageBusy:0, translationChoice:'es-ES', customTranslationName:'', customTranslationLocale:'', showPronunciation:true,
    items: [], view: 'manage', toolView:'print',
    editing: null, editingCollectionIds: null, editingUpdated:'', phraseEditorSession:0, collectionEditorSession:0, managePage: 1, manageQuery: '', manageCollectionIds:[], importText: '',
    importPreview: null, importHasHeader: true, importDelimiter: ',', importOpen:false, importColumns:{de:0, es:1, pronunciation:-1, kana:-1},
    generator: { context:'', level:'intermediate', generatedLevel:null, generatedLanguageVersion:null, items:[], collectionIds:[], busy:false, saving:false, debug:'' },
    etymologyText: '', etymologyResult: '', etymologyRequest:0,
    collections: [], memberIdsByCollection: {}, collectionQuery: '', collectionId: null, collectionEditor: null,
    printScope: 'all', printCollectionIds: [], printOnlyUnprinted: false, printOrder: 'manual', printFormat: 'html', printFontSize: 20, printLineHeight: 1.6, printRevision: 0, printGenerating: false, printPreviewLoading: false, printPreviewSaving: false, printPreview: null, printResult: null,
    session: { order:'random', items:[], supports:{ german:true, spanish:false, pronunciation:true }, revealedIds:{}, query:'', collectionIds:[], page:1, ssmlOpen:false },
    ssmlSettings: ssmlSettings_()
  };
  var PAGE_SIZE = 25;
  var el = {
    app: document.getElementById('app'), screen: document.getElementById('screen'),
    note: document.getElementById('note')
  };
  var LANGUAGES = [
    {name:'alemán', locale:'de-DE'}, {name:'inglés', locale:'en-US'},
    {name:'francés', locale:'fr-FR'}, {name:'italiano', locale:'it-IT'},
    {name:'portugués', locale:'pt-BR'}, {name:'japonés', locale:'ja-JP'},
    {name:'español', locale:'es-ES'}, {name:'ruso', locale:'ru-RU'}, {name:'chino mandarín', locale:'zh-CN'}
  ];

  function targetName_() { return state.language.name; }
  function translationName_() { return state.language.translation.name; }
  function japanese_() { return state.language.locale.split('-')[0] === 'ja'; }

  function pronunciationHtml_(item, visible) {
    var parts = (japanese_() ? [item.kana, item.pronunciation] : [item.pronunciation]).filter(Boolean);
    return (visible == null ? state.showPronunciation : visible) && parts.length ? '<span class="pronunciation">' + parts.map(esc).join('<br>') + '</span>' : '';
  }

  function pronunciationToggleHtml_() {
    return '<button class="ghost" data-act="toggle-pronunciation" aria-pressed="' + state.showPronunciation + '">' +
      (state.showPronunciation ? 'Ocultar' : 'Mostrar') + ' pronunciación</button>';
  }

  function pronunciationFieldsHtml_(item, index, locked) {
    item = item || {};
    var generated = index != null;
    var prefix = generated ? 'generated-' : 'f-';
    var suffix = generated ? '-' + index : '';
    var review = item.pronunciationNeedsReview || {};
    function field(key, label) {
      var action = key === 'kana' ? 'furigana' : japanese_() ? 'romaji' : 'pronunciación';
      return '<div class="field"><label for="' + prefix + key + suffix + '">' + label + ' (opcional)</label><textarea id="' + prefix + key + suffix + '"' +
        (generated ? ' data-generator-field="' + key + '" data-index="' + index + '"' : '') + (locked || '') + '>' + esc(item[key]) + '</textarea>' +
        (key === 'kana' ? '<p class="hint">Una sola línea: <code style="white-space:pre-wrap">日本語（にほんご）   ---   本（ほん）</code></p>' : '') +
        '<div class="ai-actions"><button class="ghost" data-act="suggest-pronunciation" data-field="' + key + '"' + (generated ? ' data-index="' + index + '"' : '') +
        (item.pronunciationBusy ? ' disabled' : locked || '') + '>' + (item.pronunciationBusy === key ? 'Sugiriendo…' : 'Sugerir ' + action + ' con IA') + '</button></div></div>';
    }
    return (japanese_() ? field('kana', 'Kanji con furigana') : '') +
      field('pronunciation', japanese_() ? 'Romaji' : 'Pronunciación / romanización') +
      '<p class="hint" id="' + prefix + 'pronunciation-warning' + suffix + '"' + (review.pronunciation || review.kana ? '' : ' hidden') + '>El original cambió: revisá sus ayudas.</p>' +
      '<p class="hint">Editable. Cada botón completa sólo su campo. La sugerencia no guarda la frase.</p>';
  }

  function languageDraft_(language) {
    language.translation = language.translation || {name:'español', locale:'es-ES'};
    state.language = language;
    state.translationChoice = LANGUAGES.some(function (item) { return item.locale === language.translation.locale && item.name === language.translation.name; }) ? language.translation.locale : 'other';
    state.customTranslationName = language.translation.name;
    state.customTranslationLocale = language.translation.locale;
    state.languageChoice = LANGUAGES.some(function (item) { return item.locale === language.locale && item.name === language.name; }) ? language.locale : 'other';
    state.customName = language.name;
    state.customLocale = language.locale;
  }

  function collectionKey_(id) { return String(id || '').toUpperCase(); }

  function collectionById_(id) {
    var key = collectionKey_(id);
    return state.collections.find(function (item) { return collectionKey_(item.id) === key; }) || null;
  }

  function assignedPhraseIds_() {
    var assigned = {};
    Object.keys(state.memberIdsByCollection).forEach(function (key) {
      state.memberIdsByCollection[key].forEach(function (id) { assigned[collectionKey_(id)] = true; });
    });
    return assigned;
  }

  function collectionIdsForPhrase_(phraseId) {
    var phraseKey = collectionKey_(phraseId);
    return Object.keys(state.memberIdsByCollection).filter(function (collectionKey) {
      return state.memberIdsByCollection[collectionKey].some(function (id) { return collectionKey_(id) === phraseKey; });
    }).map(function (collectionKey) {
      var collection = collectionById_(collectionKey);
      return collection && collection.id;
    }).filter(Boolean);
  }

  function setPhraseCollectionIds_(phraseId, collectionIds) {
    var phraseKey = collectionKey_(phraseId);
    var selected = {};
    (collectionIds || []).forEach(function (id) { selected[collectionKey_(id)] = true; });
    Object.keys(state.memberIdsByCollection).forEach(function (collectionKey) {
      var ids = state.memberIdsByCollection[collectionKey];
      var hasPhrase = ids.some(function (id) { return collectionKey_(id) === phraseKey; });
      if (hasPhrase && !selected[collectionKey]) {
        state.memberIdsByCollection[collectionKey] = ids.filter(function (id) { return collectionKey_(id) !== phraseKey; });
      } else if (!hasPhrase && selected[collectionKey]) {
        ids.push(phraseId);
      }
    });
  }

  function decorateCollections_() {
    var names = {};
    var counts = {};
    Object.keys(state.memberIdsByCollection).forEach(function (key) {
      var collection = collectionById_(key);
      if (!collection) return;
      state.memberIdsByCollection[key].forEach(function (id) {
        var phraseKey = collectionKey_(id);
        if (!names[phraseKey]) names[phraseKey] = [];
        names[phraseKey].push(collection.name);
        counts[key] = (counts[key] || 0) + 1;
      });
    });
    var assigned = assignedPhraseIds_();
    state.items.forEach(function (item) { item.collections = names[collectionKey_(item.id)] || []; });
    state.collections.forEach(function (collection) {
      collection.count = collection.unassigned
        ? state.items.filter(function (item) { return !assigned[collectionKey_(item.id)]; }).length
        : (counts[collectionKey_(collection.id)] || 0);
    });
    state.manageCollectionIds = state.manageCollectionIds.filter(function (id) { return !!collectionById_(id); });
    state.session.collectionIds = state.session.collectionIds.filter(function (id) { return !!collectionById_(id); });
    refreshPractice_(true);
    if (state.view === 'practice') renderPracticeList();
  }

  function localCollection_(id) {
    var collection = collectionById_(id);
    if (!collection) return null;
    var assigned = assignedPhraseIds_();
    var ids = collection.unassigned
      ? state.items.filter(function (item) { return !assigned[collectionKey_(item.id)]; }).map(function (item) { return item.id; })
      : (state.memberIdsByCollection[collectionKey_(id)] || []);
    var items = ids.map(byId).filter(Boolean);
    if (collection.unassigned) items.sort(function (a, b) { return b.id.localeCompare(a.id); });
    return { collection: collection, items: items };
  }

  function applyAppData_(data) {
    var original = byId(state.editing);
    var updated = (data.items || []).find(function (item) { return item.id === state.editing; });
    if (original && updated && state.editingUpdated === original.updated &&
        ['de', 'es', 'pronunciation', 'kana', 'notes', 'tags'].every(function (key) { return JSON.stringify(original[key]) === JSON.stringify(updated[key]); })) {
      state.editingUpdated = updated.updated;
    }
    if (state.language.version !== (data.language || {}).version) {
      state.generator.items = [];
      state.generator.generatedLevel = null; state.generator.generatedLanguageVersion = null;
      state.importPreview = null;
      state.printPreview = null;
      state.etymologyResult = '';
    }
    state.setup = null;
    languageDraft_(data.language || {name:'alemán', locale:'de-DE', version:0});
    state.items = data.items || [];
    state.collections = data.collections || [];
    state.memberIdsByCollection = data.memberIdsByCollection || {};
    state.collections.forEach(function (collection) {
      if (!collection.unassigned && !state.memberIdsByCollection[collectionKey_(collection.id)]) {
        state.memberIdsByCollection[collectionKey_(collection.id)] = [];
      }
    });
    state.printCollectionIds = state.printCollectionIds.filter(function (id) {
      return collectionKey_(id) === collectionKey_('__unassigned__') || !!collectionById_(id);
    });
    decorateCollections_();
  }

  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function say(message, kind) {
    el.note.textContent = message;
    el.note.className = 'show ' + (kind || 'ok');
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { el.note.className = ''; }, 3500);
  }

  function ssmlSettings_() {
    var defaults = { pause:1000, reps:1 };
    try {
      var saved = JSON.parse(localStorage.getItem('sprache-lernen-ssml-settings') || localStorage.getItem('sprache-lernen-player-settings') || localStorage.getItem('deutsch-player-settings') || '{}');
      if ([1000, 2000, 3000, 5000].indexOf(Number(saved.pause)) !== -1) defaults.pause = Number(saved.pause);
      if ([1, 2, 3, 4, 5].indexOf(Number(saved.reps)) !== -1) defaults.reps = Number(saved.reps);
    } catch (err) {}
    return defaults;
  }

  function shuffledItems_(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled;
  }

  function sessionItems_() {
    return state.session.items;
  }

  function refreshPractice_(preserve) {
    var items = matchingItems(filterCollectionItems_(state.items, state.session.collectionIds), state.session.query);
    if (preserve && state.session.order === 'random') {
      var current = new Map(items.map(function (item) { return [item.id, item]; }));
      var ordered = [];
      state.session.items.forEach(function (item) {
        if (current.has(item.id)) { ordered.push(current.get(item.id)); current.delete(item.id); }
      });
      state.session.items = ordered.concat(shuffledItems_(Array.from(current.values())));
    } else state.session.items = state.session.order === 'random' ? shuffledItems_(items) : items.slice();
    if (!preserve) {
      state.session.page = 1;
      state.session.revealedIds = {};
    } else Object.keys(state.session.revealedIds).forEach(function (id) {
      if (!items.some(function (item) { return item.id === id; })) delete state.session.revealedIds[id];
    });
  }

  function toggleSupport_(support) {
    state.session.supports[support] = !state.session.supports[support];
    state.session.revealedIds = {};
    renderPracticeList();
  }

  function byId(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) return state.items[i];
    }
    return null;
  }

  function phrasesToText(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled.map(function (item) {
      return String(item.de == null ? '' : item.de).trim().replace(/\s+/g, ' ');
    }).filter(Boolean).map(function (text) {
      return /[.!?…]$/.test(text) ? text : text + '.';
    }).join('\n\n');
  }

  function sessionToSsmlText_(items, reps, pause) {
    var breakTag = '<break time="' + (Number(pause) / 1000) + 's" />';
    var blocks = [];
    items.forEach(function (item) {
      var text = esc(String(item.de == null ? '' : item.de).trim().replace(/\s+/g, ' '));
      for (var repeat = 0; text && repeat < reps; repeat++) blocks.push(text, breakTag);
    });
    return blocks.join('\n\n');
  }

  function fallbackCopyText(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var copied = document.execCommand('copy');
    area.remove();
    if (!copied) throw new Error('No se pudo acceder al portapapeles.');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { fallbackCopyText(text); });
    }
    fallbackCopyText(text);
    return Promise.resolve();
  }

  function copySessionSsml_() {
    var text = sessionToSsmlText_(sessionItems_(), state.ssmlSettings.reps, state.ssmlSettings.pause);
    if (!text) return say('No hay frases filtradas para copiar.', 'err');
    return copyText(text).then(function () { say('Guion SSML copiado.'); }).catch(function () { say('No se pudo copiar el guion SSML.', 'err'); });
  }

  function matchingItems(items, query) {
    query = String(query || '').toLowerCase();
    if (!query) return items;
    return items.filter(function (item) {
      return (item.id + ' ' + item.de + ' ' + item.es + ' ' + (item.pronunciation || '') + ' ' + (item.kana || '') + ' ' + item.notes + ' ' +
        item.tags.join(' ')).toLowerCase().indexOf(query) !== -1;
    });
  }

  function filterCollectionItems_(items, collectionIds) {
    if (!collectionIds.length) return items;
    var included = {}, unassigned = false;
    collectionIds.forEach(function (id) {
      if (collectionKey_(id) === collectionKey_('__unassigned__')) unassigned = true;
      else (state.memberIdsByCollection[collectionKey_(id)] || []).forEach(function (phraseId) { included[collectionKey_(phraseId)] = true; });
    });
    var assigned = unassigned ? assignedPhraseIds_() : {};
    return items.filter(function (item) {
      var key = collectionKey_(item.id);
      return included[key] || (unassigned && !assigned[key]);
    });
  }

    return matchingItems(filterCollectionItems_(state.items, state.manageCollectionIds), state.manageQuery);

  function collectionFilterLabel_(ids) {

  function paginate(items, requestedPage) {

      '<button class="ghost" data-act="page" data-list="' + list + '" data-direction="1"' + (page.page === page.total ? ' disabled' : '') + '>Siguiente</button></div>';

      '<div class="field"><label for="f-es">Traducción a ' + esc(translationName_()) + '</label><textarea id="f-es" lang="' + esc(state.language.translation.locale) + '">' + esc(item ? item.es : '') + '</textarea><div class="ai-actions"><button id="ai-translate" class="ghost" data-act="translate">Traducir a ' + esc(targetName_()) + '</button></div></div>' +
      pronunciationFieldsHtml_(item, null, '') +
      '<div class="field"><label for="f-notes">Notas</label><input id="f-notes" type="text" value="' + esc(item ? item.notes : '') + '"></div>' +
      '<div class="field"><label for="f-tags">Etiquetas</label><input id="f-tags" type="text" value="' + esc(item ? item.tags.join(', ') : '') + '" placeholder="viaje, trabajo, A2"></div>' +

        '<div><label for="import-es">Columna en ' + esc(translationName_()) + '</label><select id="import-es">' + optionHtml(preview.data.columnCount, state.importColumns.es) + '</select></div><div><label for="import-pronunciation">Pronunciación (opcional)</label><select id="import-pronunciation"><option value="-1">Sin columna</option>' + optionHtml(preview.data.columnCount, state.importColumns.pronunciation) + '</select></div><div><label for="import-kana">Kanji con furigana (opcional)</label><select id="import-kana"><option value="-1">Sin columna</option>' + optionHtml(preview.data.columnCount, state.importColumns.kana) + '</select></div></div><table><tbody>' + rows + '</tbody></table>' +

        '<span class="muted">' + esc(item.id) + '</span><span style="flex:1"></span><button class="link" data-act="edit" data-id="' + esc(item.id) + '">Editar</button>' +
        '<button class="link danger" data-act="delete" data-id="' + esc(item.id) + '">Borrar</button></div></article>';

  function renderManage() {
    el.screen.innerHTML = '<div class="manage-grid"><section><div class="section-head"><h1 class="section-title">Todas las Frases</h1>' + pronunciationToggleHtml_() + '<button class="ghost" data-act="copy">Copiar ' + esc(targetName_()) + ' al azar</button></div>' +
      collectionFilterHtml_('manage', state.manageCollectionIds) + '<input id="manage-search" type="search" aria-label="Buscar frases" placeholder="Buscar frases…" value="' + esc(state.manageQuery) + '"><div class="card manage-list" id="manage-list">' + manageListHtml() + '</div></section>' +
      '<aside class="manage-side">' + editorHtml() + importHtml() + '</aside></div>';
  }

  function printableCollections_() {
    return state.collections.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function printCollectionSelected_(id) {
    return state.printCollectionIds.some(function (selectedId) { return collectionKey_(selectedId) === collectionKey_(id); });
  }

  function printEstimate_() {
    var items = state.printScope === 'all' ? state.items.slice() : [];
    var unique = {};
    var rows = 0;
    if (state.printScope === 'all') {
      items.forEach(function (item) {
        if (!state.printOnlyUnprinted || !item.printedAt) unique[collectionKey_(item.id)] = true;
      });
      rows = Object.keys(unique).length;
    } else {
      state.printCollectionIds.forEach(function (id) {
        var collection = localCollection_(id);
        if (!collection) return;
        collection.items.forEach(function (item) {
          if (state.printOnlyUnprinted && item.printedAt) return;
          rows++;
          unique[collectionKey_(item.id)] = true;
        });
      });
    }
    return { rows:rows, unique:Object.keys(unique).length };
  }

  function printCollectionOptionsHtml_() {
    var disabled = (state.printGenerating || state.printPreviewSaving) ? ' disabled' : '';
    var options = printableCollections_().map(function (collection) {
      return '<label class="print-collection-row"><input type="checkbox" data-print-collection value="' + esc(collection.id) + '"' + disabled +
        (printCollectionSelected_(collection.id) ? ' checked' : '') + '><span>' + esc(collection.name) + '</span><span class="muted">' + collection.count + '</span></label>';
    }).join('');
    return options || '<div class="empty">Todavía no hay colecciones.</div>';
  }

  function printOrderHtml_() {
    var disabled = (state.printGenerating || state.printPreviewSaving) ? ' disabled' : '';
    return state.printCollectionIds.map(function (id, index) {
      var collection = collectionById_(id);
      if (!collection && collectionKey_(id) === collectionKey_('__unassigned__')) collection = { name:'Sin colección' };
      return '<div class="print-order-row"><span>' + esc(collection ? collection.name : id) + '</span><div class="print-order-actions">' +
        '<button class="link" data-act="move-print-collection" data-index="' + index + '" data-direction="-1"' + disabled + (index ? '' : ' disabled') + '>↑</button>' +
        '<button class="link" data-act="move-print-collection" data-index="' + index + '" data-direction="1"' + disabled + (index === state.printCollectionIds.length - 1 ? ' disabled' : '') + '>↓</button></div></div>';
    }).join('') || '<div class="empty">Elegí al menos una colección.</div>';
  }

  function printSummaryHtml_() {
    var estimate = printEstimate_();
    if (!estimate.unique) return '<div class="print-summary">No hay frases que coincidan con esta selección.</div>';
    return '<div class="print-summary">' + estimate.unique + ' frases distintas' +
      (estimate.rows !== estimate.unique ? ' · ' + estimate.rows + ' filas por repeticiones entre colecciones' : '') + '</div>';
  }

  function capturePrintPreview_() {
    var preview = document.getElementById('print-preview-content');
    if (preview && state.printPreview && preview.printPreview === state.printPreview) state.printPreview.body = preview.innerHTML;
  }

  function printPreviewHtml_() {
    if (state.printFormat !== 'html') return '';
    if (!state.printPreview) return '<div class="print-summary">Previsualizá el material para editarlo antes de descargarlo.</div>';
    var body = document.createElement('div');
    body.innerHTML = state.printPreview.body;
    body.querySelectorAll('td[data-print-pronunciation]').forEach(function (cell) { cell.contentEditable = 'false'; });
    body.querySelectorAll('[data-pronunciation-field]').forEach(function (field) {
      field.contentEditable = state.printGenerating || state.printPreviewSaving ? 'false' : 'true';
      field.tabIndex = 0;
    });
    var aids = !!body.querySelector('[data-pronunciation-field]');
    return '<div class="print-preview"><div class="section-head"><h2 class="section-title">Vista previa editable</h2><span class="hint">Hacé clic en el texto o las celdas para corregirlo.</span></div>' +
      (aids ? '<p class="hint">Guardá la pronunciación para actualizar las frases y dejarlas pendientes de incluir en material. Los demás cambios sólo afectan el archivo.</p><button class="ghost" data-act="save-print-pronunciation"' + (state.printPreviewSaving || state.printGenerating || state.printPreviewLoading ? ' disabled' : '') + '>' + (state.printPreviewSaving ? 'Guardando…' : 'Guardar pronunciación') + '</button>' : '') +
      '<div id="print-preview-content" class="print-preview-content" contenteditable="' + (state.printGenerating || state.printPreviewSaving ? 'false' : 'true') + '" spellcheck="false" style="--material-size:' + state.printFontSize + 'px;--material-leading:' + state.printLineHeight + '">' + body.innerHTML + '</div></div>';
  }

  function printPronunciationEdits_() {
    if (!state.printPreview) return [];
    var phrases = {}, edits = {};
    (state.printPreview.phrases || []).forEach(function (item) { phrases[item.id] = item; });
    var body = document.createElement('div');
    body.innerHTML = state.printPreview.body;
    body.querySelectorAll('[data-pronunciation-field]').forEach(function (field) {
      var id = field.dataset.phraseId, name = field.dataset.pronunciationField;
      var item = phrases[id];
      if (!item || (name !== 'kana' && name !== 'pronunciation')) return;
      field.querySelectorAll('br').forEach(function (node) { node.replaceWith('\n'); });
      field.querySelectorAll('div,p').forEach(function (node) { node.append('\n'); });
      var value = field.textContent.trim();
      if (value === item[name]) return;
      var edit = edits[id] || (edits[id] = {});
      if (Object.prototype.hasOwnProperty.call(edit, name) && edit[name] !== value) {
        throw new Error('La frase ' + id + ' tiene pronunciaciones distintas entre colecciones. Igualalas antes de guardar.');
      }
      edit[name] = value;
    });
    return Object.keys(edits).map(function (id) {
      var item = phrases[id];
      return Object.assign({id:id, pronunciation:item.pronunciation, kana:item.kana, expectedUpdated:item.updated}, edits[id]);
    });
  }

  function mergePrintPronunciations_(editedBody, savedBody) {
    var edited = document.createElement('div'), saved = document.createElement('div'), rows = {};
    edited.innerHTML = editedBody;
    saved.innerHTML = savedBody;
    saved.querySelectorAll('tr[data-phrase-id]').forEach(function (row) { rows[row.dataset.phraseId] = row; });
    edited.querySelectorAll('tr[data-phrase-id]').forEach(function (row) {
      var previous = row.querySelector('[data-print-pronunciation]');
      var current = rows[row.dataset.phraseId] && rows[row.dataset.phraseId].querySelector('[data-print-pronunciation]');
      if (previous && current) previous.replaceWith(current.cloneNode(true));
      else if (previous) previous.remove();
    });
    if (!saved.querySelector('th[data-print-pronunciation]')) {
      edited.querySelectorAll('th[data-print-pronunciation]').forEach(function (node) { node.remove(); });
    }
    return edited.innerHTML;
  }

  function savePrintPronunciation_() {
    if (!state.printPreview || state.printPreviewSaving || state.printGenerating || state.printPreviewLoading || state.loadingData) return;
    capturePrintPreview_();
    var edits;
    try { edits = printPronunciationEdits_(); } catch (err) { return say(err.message, 'err'); }
    if (!edits.length) return say('No hay cambios de pronunciación para guardar.');
    var preview = state.printPreview, revision = state.printRevision;
    var payload = printPayload_();
    payload.edits = edits;
    state.printPreviewSaving = true;
    state.languageBusy++;
    clearPrintDownload_();
    renderPrint();
    writeData_('saveMaterialPronunciations', payload, function (result) {
      state.printPreviewSaving = false;
      state.languageBusy--;
      result.items.forEach(function (item) {
        var existing = byId(item.id);
        if (existing) Object.assign(existing, item);
      });
      decorateCollections_();
      if (revision === state.printRevision && preview === state.printPreview) {
        preview.body = mergePrintPronunciations_(preview.body, result.body);
        preview.signature = result.signature;
        preview.phrases = result.phrases;
      }
      if (state.view === 'print') renderPrint();
      say('Pronunciación guardada. Las frases modificadas quedaron pendientes de incluir en material.');
    }, function (err) {
      state.printPreviewSaving = false;
      state.languageBusy--;
      if (state.view === 'print') renderPrint();
      say(err.message, 'err');
    });
  }

  function clearPrintDownload_() {
    if (state.printResult && state.printResult.url && window.URL && window.URL.revokeObjectURL) {
      window.URL.revokeObjectURL(state.printResult.url);
    }
    state.printResult = null;
  }

  function clearPrintResult_(preservePreview) {
    state.printRevision++;
    clearPrintDownload_();
    state.printPreviewLoading = false;
    if (!preservePreview) state.printPreview = null;
  }

  function renderPrint() {
    var collections = state.printScope === 'collections';
    var result = state.printResult;
    var estimate = printEstimate_();
    var buttonLabel = state.printGenerating ? 'Generando material…' : (state.printFormat === 'html' ? 'Descargar HTML' : 'Descargar Markdown');
    var disabled = (state.printGenerating || state.printPreviewSaving) ? ' disabled' : '';
    el.screen.innerHTML = '<div class="print-grid"><section class="panel print-panel"><div class="section-head"><h1 class="section-title">Preparar material para imprimir</h1></div>' +
      '<p class="hint">HTML mantiene el tamaño de letra y la tabla al abrirlo en el ebook o al imprimirlo. También podés editar la vista previa.</p>' +
      '<div class="field"><label>Qué incluir</label><div class="print-options">' +
      '<label class="print-option"><input type="radio" name="print-scope" value="all"' + disabled + (state.printScope === 'all' ? ' checked' : '') + '> Todas las frases</label>' +
      '<label class="print-option"><input type="radio" name="print-scope" value="collections"' + disabled + (collections ? ' checked' : '') + '> Colecciones seleccionadas</label></div></div>' +
      (collections ? '<div class="section-head"><h2 class="section-title">Colecciones</h2><span><button class="link" data-act="select-all-print-collections"' + disabled + '>Todas</button><button class="link" data-act="clear-print-collections"' + disabled + '>Limpiar</button></span></div><div class="card print-collection-list">' + printCollectionOptionsHtml_() + '</div><h2 class="section-title" style="margin-top:18px">Orden de colecciones</h2><p class="hint">Este orden sólo se aplica a este archivo.</p><div class="print-order-list">' + printOrderHtml_() + '</div>' : '') +
      '<div class="field" style="margin-top:18px"><label for="print-order">Orden de frases</label><select id="print-order"' + disabled + '><option value="manual"' + (state.printOrder === 'manual' ? ' selected' : '') + '>Orden actual</option><option value="random"' + (state.printOrder === 'random' ? ' selected' : '') + '>Aleatorio</option></select></div>' +

      renderPreservingDrafts_();
    }).withFailureHandler(function (err) {
      if (revision !== state.printRevision) return;

    }).previewPhraseMaterial(printPayload_());

  function replaceMaterialBody_(document, body) {
    var start = document.indexOf('<body');
    var openEnd = document.indexOf('>', start);
    var close = document.lastIndexOf('</body>');
    return start === -1 || openEnd === -1 || close === -1 ? document : document.slice(0, openEnd + 1) + body + document.slice(close);
  }

  function generatePrintMaterial_() {
    var estimate = printEstimate_();
    if (!estimate.unique || state.printGenerating || state.printPreviewSaving || state.printPreviewLoading) return;
    capturePrintPreview_();
    try {
      if (printPronunciationEdits_().length) return say('Guardá la pronunciación editada antes de descargar el material.', 'err');
    } catch (err) { return say(err.message, 'err'); }
    var format = state.printFormat;
    var editedBody = format === 'html' && state.printPreview ? state.printPreview.body : null;
    var payload = printPayload_();
    state.printGenerating = true;
    clearPrintDownload_();
    state.printRevision++;
    var revision = state.printRevision;
    renderPrint();
    var method = format === 'html' ? 'generatePhraseHtml' : 'generatePhraseMarkdown';
    var mime = format === 'html' ? 'text/html;charset=utf-8' : 'text/markdown;charset=utf-8';
    writeData_(method, payload, function (result) {
      var useEditedBody = format === 'html' && editedBody !== null && revision === state.printRevision;
      var content = useEditedBody ? replaceMaterialBody_(result.content, editedBody) : result.content;
      var blob = new Blob([content], {type:mime});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = result.name;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      state.printGenerating = false;
      state.printPreview = format === 'html' && revision === state.printRevision ? {body:useEditedBody ? editedBody : result.body, includedCount:result.includedCount, rowCount:result.rowCount, name:result.name, signature:result.signature, phrases:result.phrases || []} : null;
      state.printResult = {url:url, name:result.name, includedCount:result.includedCount, rowCount:result.rowCount, markedAt:result.markedAt};
      renderPreservingDrafts_();
      reload(function () {
        renderPreservingDrafts_();
        say('Material descargado y frases marcadas.');
      }, true);
    }, function (err) {
      state.printGenerating = false;
      renderPreservingDrafts_();
      say(err.message, 'err');
    });
  }

  function generatePhrases_() {
    var draft = state.generator;
    if (draft.busy || draft.items.some(function (item) { return item.pronunciationBusy; })) return;
    if (!draft.context.trim()) return say('Escribí una situación o temática.', 'err');
    if (draft.items.some(function (item) { return !item.saved; }) && !confirm('¿Descartar los borradores sin guardar cuando esté lista la nueva tanda?')) return;
    var level = draft.level;
    var languageVersion = state.language.version;
    draft.debug = '';
    draft.busy = true;
    renderGenerator();
    google.script.run.withSuccessHandler(function (items) {
      draft.busy = false;
      if (languageVersion !== state.language.version) {
        if (state.view === 'generate') renderGenerator();
        return say('El idioma cambió. Generá una nueva tanda.', 'err');
      }
      draft.generatedLanguageVersion = languageVersion;
      draft.items = items.map(function (item) { return { de:item.de, es:item.es, pronunciation:'', kana:'', selected:false, saved:false }; });
      draft.generatedLevel = level;
      draft.debug = '';
      if (state.view === 'generate') renderGenerator();
      say('10 frases listas para revisar.');
    }).withFailureHandler(function (err) {
      draft.busy = false;
      if (languageVersion !== state.language.version) {
        if (state.view === 'generate') renderGenerator();
        return;
      }
      var parts = String(err.message || '').split('\n\nRespuesta de Gemini:\n');
      draft.debug = parts.length > 1 ? parts.slice(1).join('\n\nRespuesta de Gemini:\n') : '';
      if (state.view === 'generate') renderGenerator();
      say(parts[0], 'err');
    }).generatePhrases(draft.context, level, languageVersion);
  }

  function saveGeneratedPhrases_() {
    var draft = state.generator;
    if (draft.busy || draft.items.some(function (item) { return item.pronunciationBusy; })) return;
    if (state.loadingData) return say('Esperá a que termine la actualización antes de guardar.', 'err');
    if (Number.isInteger(draft.generatedLanguageVersion) && draft.generatedLanguageVersion !== state.language.version) return say('El idioma cambió. Generá una nueva tanda.', 'err');
    var selected = draft.items.filter(function (item) { return item.selected && !item.saved; });
    if (!selected.length) return say('Elegí al menos una frase.', 'err');
    if (selected.some(function (item) { return !item.de.trim() || !item.es.trim(); })) return say('Completá ' + targetName_() + ' y ' + translationName_() + ' de las frases seleccionadas.', 'err');
    draft.busy = true;
    draft.saving = true;
    renderGenerator();
    writeData_('saveGeneratedPhrases', { items:selected.map(function (item) { return { de:item.de, es:item.es, pronunciation:item.pronunciation || '', kana:item.kana || '' }; }), collectionIds:draft.collectionIds.slice(), expectedLanguageVersion:state.language.version }, function (data) {
      data.results.forEach(function (result, index) {
        var existing = byId(result.item.id);
        if (existing) state.items[state.items.indexOf(existing)] = result.item;
        else state.items.unshift(result.item);
        setPhraseCollectionIds_(result.item.id, result.collectionIds);
        selected[index].saved = true;
        selected[index].reused = result.reused;
        selected[index].de = result.item.de;
        selected[index].es = result.item.es;
        selected[index].pronunciation = result.item.pronunciation;
        selected[index].kana = result.item.kana;
      });
      draft.busy = false;
      draft.saving = false;
      decorateCollections_();
      // Conservá formularios y material editado; el backend valida la firma del material al descargar.
      if (state.view === 'generate') renderGenerator();
      say(draft.collectionIds.length ? 'Frases agregadas a las colecciones elegidas.' : 'Frases agregadas sin asignar colecciones nuevas.');
    }, function (err) {
      draft.busy = false;
      draft.saving = false;
      if (state.view === 'generate') renderGenerator();
      say(err.message, 'err');
    });
  }

      return '<div class="field" style="margin-top:16px"><label for="' + prefix + '-choice">' + label + '</label><select id="' + prefix + '-choice"' + disabled + '>' + options +
        '<option value="other"' + (choice === 'other' ? ' selected' : '') + '>Otro</option></select></div>' +
        (choice === 'other' ? '<div class="field"><label for="' + prefix + '-name">Nombre del idioma</label><input id="' + prefix + '-name" type="text" maxlength="40" value="' + esc(name) + '"' + disabled + '></div>' +
          '<div class="field"><label for="' + prefix + '-locale">Código de idioma</label><input id="' + prefix + '-locale" type="text" value="' + esc(locale) + '" placeholder="Por ejemplo: nl-NL"' + disabled + '></div>' : '');
    }
    el.screen.innerHTML = '<section class="panel form-panel" style="max-width:640px;margin:auto"><h1 class="section-title">' +
      (state.setup ? 'Configuración inicial' : 'Configuración') + '</h1><p class="hint">Elegí el idioma objetivo y el idioma de traducción. La interfaz seguirá en español.</p>' +
      languageFields('language', state.languageChoice, state.customName, state.customLocale, 'Idioma objetivo') +
      languageFields('translation', state.translationChoice, state.customTranslationName, state.customTranslationLocale, 'Idioma de traducción') +

  }

  function saveLanguageSettings_() {
    if (state.configSaving) return;
    if (state.loadingData || state.writingData) return say('Esperá a que termine la operación pendiente.', 'err');
    if (state.generator.busy) return say('Esperá a que termine la generación o el guardado.', 'err');
    if (state.printGenerating || state.printPreviewLoading || state.languageBusy) return say('Esperá a que terminen las operaciones pendientes.', 'err');
    var selected = LANGUAGES.find(function (language) { return language.locale === state.languageChoice; });
    var language = selected || {name:state.customName.trim(), locale:state.customLocale.trim()};
    var translation = LANGUAGES.find(function (item) { return item.locale === state.translationChoice; }) ||
      {name:state.customTranslationName.trim(), locale:state.customTranslationLocale.trim()};
    if (!language.name || !language.locale || !translation.name || !translation.locale) return say('Completá ambos idiomas y sus códigos.', 'err');
    var changed = language.name !== state.language.name || language.locale !== state.language.locale ||
      translation.name !== translationName_() || translation.locale !== state.language.translation.locale;
    if (!state.setup && changed &&
        !confirm('Se conservarán las frases existentes y las herramientas usarán el nuevo par. Los borradores generados se descartarán. ¿Cambiar los idiomas?')) return;
    state.configSaving = true;
    renderSettings();
    google.script.run.withSuccessHandler(function (savedLanguage) {
      state.configSaving = false;
      state.setup = null;
      if (changed) { state.etymologyResult = ''; state.generator.items = []; state.generator.generatedLevel = null; state.generator.generatedLanguageVersion = null; state.importPreview = null; }
      languageDraft_(savedLanguage);

    }).withFailureHandler(function (err) {
      state.configSaving = false;
      renderSettings();
      say(err.message, 'err');
    }).saveLanguageSettings({name:language.name, locale:language.locale, translation:translation, expectedVersion:state.language.version});
  }

  function render() {
    document.querySelector('nav').style.display = state.setup ? 'none' : '';
    document.querySelector('[data-act="refresh-data"]').style.display = state.setup ? 'none' : '';
    var tools = ['print', 'generate', 'etymology'].indexOf(state.view) !== -1;

    toolNav.hidden = !!state.setup || !tools;

  }

  function editorDraft_() {
    var values = {};
    ['f-de', 'f-es', 'f-pronunciation', 'f-kana', 'f-notes', 'f-tags', 'collection-name'].forEach(function (id) {
      var field = document.getElementById(id);
      if (field) values[id] = field.value;
    });
    var warning = document.getElementById('f-pronunciation-warning');
    return {values:values, collectionIds:Array.prototype.map.call(document.querySelectorAll('input[name="phrase-collection"]:checked'), function (input) { return input.value; }),
      review:warning && Object.assign({}, warning.pronunciationNeedsReview)};
  }

  function renderPreservingDrafts_() {
    var draft = editorDraft_();
    var focused = document.activeElement;
    var selection = focused && [focused.selectionStart, focused.selectionEnd];
    capturePrintPreview_();
    render();
    Object.keys(draft.values).forEach(function (id) {
      var field = document.getElementById(id);
      if (field) field.value = draft.values[id];
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="phrase-collection"]'), function (input) { input.checked = draft.collectionIds.indexOf(input.value) !== -1; });
    var warning = document.getElementById('f-pronunciation-warning');
    if (warning && draft.review) {
      warning.pronunciationNeedsReview = draft.review;
      warning.hidden = !draft.review.pronunciation && !draft.review.kana;
    }
    var field = focused && Object.prototype.hasOwnProperty.call(draft.values, focused.id) && document.getElementById(focused.id);
    if (field) { field.focus({preventScroll:true}); field.setSelectionRange(selection[0], selection[1]); }
  }

  function writeData_(method, payload, success, failure) {
    failure = failure || function (err) { say(err.message, 'err'); };
    if (state.loadingData || state.writingData || state.configSaving) return failure({message:'Esperá a que termine la operación pendiente.'});
    state.writingData = true;
    google.script.run.withSuccessHandler(function (result) {
      state.writingData = false;
      success(result);
    }).withFailureHandler(function (err) {
      state.writingData = false;
      failure(err);
    })[method](payload);
  }

  function saveCollection() {
    var input = document.getElementById('collection-name');
    var name = input.value;
    if (!name.trim()) return say('Escribí un nombre para la colección.', 'err');
    var isNew = state.collectionEditor === 'new';
    var editorSession = state.collectionEditorSession;
    writeData_(isNew ? 'createCollection' : 'renameCollection', { id:state.collectionId, name:name }, function (collection) {
      clearPrintResult_(true);
      if (isNew) {
        state.collections.push(collection);
        state.memberIdsByCollection[collectionKey_(collection.id)] = [];
      } else {
        var current = collectionById_(collection.id);
        if (current) current.name = collection.name;
      }
      if (state.collectionEditorSession === editorSession && state.collectionEditor) {
        var currentInput = document.getElementById('collection-name');
        state.collectionEditor = currentInput && currentInput.value !== name ? collection.id : null;
        state.collectionId = state.collectionEditor;
      }
      decorateCollections_();
      renderPreservingDrafts_();
      say(isNew ? 'Colección creada.' : 'Nombre guardado.');

  function deleteCurrentCollection(id) {

      decorateCollections_();

  function savePhrase() {
    if (state.languageBusy) return say('Esperá a que termine la operación pendiente.', 'err');
    var id = state.editing || '';
    var editorSession = state.phraseEditorSession, draft = editorDraft_();
    var collectionIds = draft.collectionIds;
    var payload = { id:id, de:document.getElementById('f-de').value, es:document.getElementById('f-es').value,
      pronunciation:document.getElementById('f-pronunciation').value,
      kana:japanese_() ? document.getElementById('f-kana').value : (id && byId(id) ? byId(id).kana || '' : ''), expectedLanguageVersion:state.language.version,
      notes:document.getElementById('f-notes').value, tags:document.getElementById('f-tags').value,
      expectedUpdated:state.editingUpdated, expectedCollectionIds:id ? (state.editingCollectionIds || []) : [], collectionIds:collectionIds };
    if (!payload.de.trim()) return say('Escribí la frase en ' + targetName_() + ' antes de guardar.', 'err');
    state.languageBusy++;
    writeData_('savePhrase', payload, function (result) {
      state.languageBusy--;
      clearPrintResult_(true);
      var item = result.item;
      if (id) state.items[state.items.indexOf(byId(id))] = item; else state.items.unshift(item);
      setPhraseCollectionIds_(item.id, result.collectionIds);

  function originalChanged_(index) {
    var generated = index != null;
    var item = generated ? state.generator.items[index] : null;
    var pronunciation = generated ? item.pronunciation : document.getElementById('f-pronunciation').value;
    var kanaField = document.getElementById('f-kana');
    var kana = generated ? item.kana : kanaField && kanaField.value;
    var review = {pronunciation:!!pronunciation, kana:!!kana};
    var warning = document.getElementById(generated ? 'generated-pronunciation-warning-' + index : 'f-pronunciation-warning');
    if (item) item.pronunciationNeedsReview = review;
    else if (warning) warning.pronunciationNeedsReview = review;
    if (warning) warning.hidden = !review.pronunciation && !review.kana;
  }

  function suggestPronunciation_(button) {
    var field = button.dataset.field || 'pronunciation';
    var generated = button.dataset.index != null;
    var index = generated ? Number(button.dataset.index) : null;
    var item = generated ? state.generator.items[index] : null;
    if (button.disabled || (item && (item.saved || item.pronunciationBusy || state.generator.busy))) return;
    var source = generated ? null : document.getElementById('f-de');
    var target = generated ? null : document.getElementById('f-' + field);
    var text = generated ? item.de : source.value;
    if (!text.trim()) return say('Escribí el texto original antes de sugerir la pronunciación.', 'err');
    if (field === 'kana' && !/\p{Script=Han}/u.test(text)) return say('La frase no tiene kanji; no necesita furigana.');
    var previous = generated ? item[field] : target.value;
    var languageVersion = state.language.version;
    var buttonLabel = button.textContent;
    if (item) item.pronunciationBusy = field;
    button.disabled = true;
    button.textContent = 'Sugiriendo…';
    state.languageBusy++;
    if (generated && state.view === 'generate') renderGenerator();
    google.script.run.withSuccessHandler(function (result) {
      state.languageBusy--;
      if (item) item.pronunciationBusy = false;
      restoreAiButton(button, buttonLabel);
      if (languageVersion !== state.language.version) return;
      var unchanged = generated ? state.generator.items.indexOf(item) !== -1 && item.de === text && item[field] === previous :
        document.body.contains(button) && source.value === text && target.value === previous;
      if (!unchanged) {
        if (generated && state.view === 'generate') renderGenerator();
        return say('El texto o sus ayudas cambiaron. Volvé a sugerir la pronunciación.', 'err');
      }
      var warning = document.getElementById(generated ? 'generated-pronunciation-warning-' + index : 'f-pronunciation-warning');
      var review = (item || warning).pronunciationNeedsReview || {};
      review[field] = false;
      if (item) {
        item[field] = result[field];
        if (state.view === 'generate') renderGenerator();
      } else {
        target.value = result[field];
      }
      if (warning) warning.hidden = !review.pronunciation && !review.kana;
      say('Ayuda sugerida. Revisala antes de guardar.');
    }).withFailureHandler(function (err) {
      state.languageBusy--;
      if (item) item.pronunciationBusy = false;
      restoreAiButton(button, buttonLabel);
      if (generated && state.view === 'generate') renderGenerator();
      say(err.message, 'err');
    }).suggestPronunciation(text, languageVersion, field);
  }

  function restoreAiButton(button, label) {
    if (!document.body.contains(button)) return;
    button.disabled = false;
    button.textContent = label;
  }

  function translatePhrase_(toOriginal) {
    var source = document.getElementById(toOriginal ? 'f-es' : 'f-de');
    var target = document.getElementById(toOriginal ? 'f-de' : 'f-es');
    var button = document.getElementById(toOriginal ? 'ai-translate' : 'ai-translate-to-es');
    if (!source || !target || !button || button.disabled) return;
    var from = toOriginal ? translationName_() : targetName_();
    var to = toOriginal ? targetName_() : translationName_();
    var text = source.value, previousTarget = target.value, languageVersion = state.language.version;
    if (!text.trim()) return say('Escribí la frase en ' + from + ' antes de traducir.', 'err');
    button.disabled = true;
    button.textContent = 'Traduciendo…';
    state.languageBusy++;
    google.script.run.withSuccessHandler(function (translation) {
      state.languageBusy--;
      restoreAiButton(button, 'Traducir a ' + to);
      if (languageVersion !== state.language.version || !document.body.contains(button) ||
          source.value !== text || target.value !== previousTarget) {
        return say('El texto o el idioma cambiaron. Volvé a solicitar la traducción.', 'err');
      }
      target.value = translation;
      if (toOriginal) originalChanged_();
      say('Propuesta en ' + to + ' lista.');
    }).withFailureHandler(function (err) {
      state.languageBusy--;
      restoreAiButton(button, 'Traducir a ' + to);
      say(err.message, 'err');
    })[toOriginal ? 'suggestGermanTranslation' : 'suggestSpanishTranslation'](text, languageVersion);
  }

  function translateToGerman() { translatePhrase_(true); }

  function translateToSpanish() { translatePhrase_(false); }

  function showEtymology() {

    var result = document.getElementById('ai-etymology-result');

    button.disabled = true;
    button.textContent = 'Analizando…';
    result.hidden = false;
    result.textContent = 'Analizando etimología…';
    state.languageBusy++;
    var languageVersion = state.language.version;
    var input = source.value, request = ++state.etymologyRequest;
    google.script.run.withSuccessHandler(function (text) {

    }).analyzeEtymology(source.value, languageVersion);
  }

  function removePhrase(id) {
    var item = byId(id);
    if (!item || !confirm('Borrar ' + id + '? Se elimina la fila de la hoja.')) return;

        state.memberIdsByCollection[key] = state.memberIdsByCollection[key].filter(function (phraseId) { return phraseId !== id; });
      });

  function importSettings() {
    var delimiter = document.querySelector('input[name="delimiter"]:checked');
    return { text:document.getElementById('import-text').value, delimiter:delimiter && delimiter.value === 'tab' ? '\t' : ',',
      hasHeader:document.getElementById('import-header').checked };

    state.importHasHeader = settings.hasHeader;

    state.importOpen = true;
    google.script.run.withSuccessHandler(function (data) {

    var settings = importSettings();

      return say('Actualizá la vista previa antes de importar.', 'err');

      deColumn:Number(document.getElementById('import-de').value), esColumn:Number(document.getElementById('import-es').value),
      pronunciationColumn:Number(document.getElementById('import-pronunciation').value), kanaColumn:Number(document.getElementById('import-kana').value) };
    var draft = JSON.stringify([state.importText, state.importDelimiter, state.importHasHeader, state.importColumns]);
    state.languageBusy++;

  function reload(done, preservePrint) {
    if (state.writingData || state.configSaving) return say('Esperá a que termine el guardado antes de actualizar.', 'err');
    if (state.loadingData) return;

      state.loadingData = false;
      say(err.message, 'err');

  el.app.addEventListener('click', function (event) {
    var button = event.target.closest('[data-act]');
    if (!button) return;
    var act = button.dataset.act;
    if (state.configSaving && act !== 'save-language') return;
    if (act === 'suggest-pronunciation') return suggestPronunciation_(button);
    if (act === 'toggle-pronunciation') {
      state.showPronunciation = !state.showPronunciation;
      if (state.view === 'manage') {
        button.textContent = (state.showPronunciation ? 'Ocultar' : 'Mostrar') + ' pronunciación';
        button.setAttribute('aria-pressed', String(state.showPronunciation));
        return renderManageList();
      }
      return render();
    }
    if (act === 'save-language') return saveLanguageSettings_();
    if (act === 'generate-phrases') return generatePhrases_();
    if (act === 'save-generated') return saveGeneratedPhrases_();
    if (act === 'generator-select-all' || act === 'generator-select-none') {
      if (state.generator.busy) return;
      state.generator.items.forEach(function (item) { if (!item.saved) item.selected = act === 'generator-select-all'; });
      return renderGenerator();
    }
    if (act === 'refresh-data') {
      if (state.view === 'print') capturePrintPreview_();
      say('Actualizando datos…');
      return reload(function () {
        renderPreservingDrafts_();
        say('Datos actualizados.');
      });
    }
    if (act === 'select-all-print-collections') return selectAllPrintCollections_();
    if (act === 'clear-print-collections') return clearPrintCollections_();
    if (act === 'move-print-collection') return movePrintCollection_(Number(button.dataset.index), Number(button.dataset.direction));
    if (act === 'preview-material') return previewPrintMaterial_();
    if (act === 'generate-material') return generatePrintMaterial_();
    if (act === 'save-print-pronunciation') return savePrintPronunciation_();
    if (act === 'switch-view') {
      if (state.view === 'print') capturePrintPreview_();
      state.view = button.dataset.view === 'tools' ? state.toolView : button.dataset.view;
      if (['print', 'generate', 'etymology'].indexOf(state.view) !== -1) state.toolView = state.view;
      state.editing = null;
      state.editingCollectionIds = null;
      return render();
    }
    if (act === 'new-collection') { state.collectionEditorSession++; state.collectionId = null; state.collectionEditor = 'new'; return render(); }
    if (act === 'edit-collection') { state.collectionEditorSession++; state.collectionId = button.dataset.id; state.collectionEditor = state.collectionId; return render(); }
    if (act === 'cancel-collection-editor') { state.collectionEditor = null; state.collectionId = null; return render(); }
    if (act === 'save-collection') return saveCollection();
    if (act === 'delete-collection') return deleteCurrentCollection(button.dataset.id);
    if (act === 'toggle-support') {
      var support = button.dataset.support;
      toggleSupport_(support);
      document.querySelector('[data-support="' + support + '"]').focus({preventScroll:true});
      return;
    }
    if (act === 'reveal-practice') {
      var phraseId = button.dataset.id;
      state.session.revealedIds[phraseId] = !state.session.revealedIds[phraseId];
      renderPracticeList();
      document.querySelector('#session-list [data-id="' + phraseId + '"]').focus({preventScroll:true});
      return;
    }
    if (act === 'copy-session-ssml') return copySessionSsml_();
    if (act === 'clear-phrase-filter') {
      if (button.dataset.list === 'manage') { state.manageCollectionIds = []; state.managePage = 1; }
      else { state.session.collectionIds = []; refreshPractice_(); }
      Array.prototype.forEach.call(document.querySelectorAll('[data-phrase-filter="' + button.dataset.list + '"]'), function (input) { input.checked = false; });
      document.getElementById(button.dataset.list + '-collection-summary').textContent = collectionFilterLabel_([]);
      return button.dataset.list === 'manage' ? renderManageList() : renderPracticeList();
    }
    if (act === 'new') { state.phraseEditorSession++; state.editing = ''; state.editingCollectionIds = []; state.editingUpdated = ''; return render(); }
    if (act === 'edit') { state.phraseEditorSession++; state.view = 'manage'; state.editing = button.dataset.id; state.editingCollectionIds = collectionIdsForPhrase_(state.editing); state.editingUpdated = byId(state.editing).updated; return render(); }
    if (act === 'cancel-editor') { state.editing = null; state.editingCollectionIds = null; return render(); }
    if (act === 'save-phrase') return savePhrase();
    if (act === 'translate') return translateToGerman();
    if (act === 'translate-to-es') return translateToSpanish();
    if (act === 'etymology') return showEtymology();
    if (act === 'page') {
      if (button.dataset.list === 'manage') { state.managePage += Number(button.dataset.direction); return renderManageList(); }
      state.session.page += Number(button.dataset.direction);
      return renderPracticeList();
    }
    if (act === 'delete') return removePhrase(button.dataset.id);
    if (act === 'copy') {
      var text = phrasesToText(managedItems());
      if (!text) return say('No hay frases visibles para copiar.', 'err');
      return copyText(text).then(function () { say('Frases copiadas.'); }).catch(function () { say('No se pudo copiar el texto.', 'err'); });
    }
    if (act === 'preview-import') return previewImport();
    if (act === 'import') return importPhrases();
  });

  el.app.addEventListener('input', function (event) {
    if (event.target.id === 'generator-context') state.generator.context = event.target.value;
    else if (event.target.id === 'language-name') state.customName = event.target.value;
    else if (event.target.id === 'language-locale') state.customLocale = event.target.value;
    else if (event.target.id === 'translation-name') state.customTranslationName = event.target.value;
    else if (event.target.id === 'translation-locale') state.customTranslationLocale = event.target.value;
    else if (event.target.id === 'f-de') originalChanged_();
    else if (event.target.matches('[data-generator-field]')) {
      var draftIndex = Number(event.target.dataset.index);
      state.generator.items[draftIndex][event.target.dataset.generatorField] = event.target.value;
      if (event.target.dataset.generatorField === 'de') originalChanged_(draftIndex);
    }
    else if (event.target.id === 'manage-search') { state.manageQuery = event.target.value; state.managePage = 1; renderManageList(); }
    else if (event.target.id === 'practice-search') { state.session.query = event.target.value; refreshPractice_(); renderPracticeList(); }
    else if (event.target.id === 'import-text') state.importText = event.target.value;
    else if (event.target.id === 'etymology-source') {
      state.etymologyText = event.target.value; state.etymologyResult = '';
      var result = document.getElementById('ai-etymology-result');
      result.hidden = true; result.textContent = '';
    }
    else if (event.target.id === 'collection-search') {
      var collectionCursor = event.target.selectionStart;
      state.collectionQuery = event.target.value;
      renderCollections();
      var collectionSearch = document.getElementById('collection-search');
      if (collectionSearch) { collectionSearch.focus(); collectionSearch.setSelectionRange(collectionCursor, collectionCursor); }
    }
  });
  el.app.addEventListener('change', function (event) {
    if (event.target.id === 'language-choice') {
      state.languageChoice = event.target.value;
      if (state.languageChoice === 'other' && LANGUAGES.some(function (item) { return item.locale === state.customLocale; })) {
        state.customName = '';
        state.customLocale = '';
      }
      return renderSettings();
    } else if (event.target.id === 'translation-choice') {
      state.translationChoice = event.target.value;
      if (state.translationChoice === 'other' && LANGUAGES.some(function (item) { return item.locale === state.customTranslationLocale; })) {
        state.customTranslationName = ''; state.customTranslationLocale = '';
      }
      return renderSettings();
    } else if (event.target.id === 'generator-level') {
      state.generator.level = event.target.value;
    } else if (event.target.matches('[data-generator-select]')) {
      state.generator.items[Number(event.target.dataset.generatorSelect)].selected = event.target.checked;
      return renderGenerator();
    } else if (event.target.matches('[data-generator-collection]')) {
      if (event.target.checked) state.generator.collectionIds.push(event.target.value);
      else state.generator.collectionIds = state.generator.collectionIds.filter(function (id) { return id !== event.target.value; });
      return renderGenerator();
    } else if (event.target.matches('[data-print-status]')) {
      return setPrintStatus_(event.target.dataset.id, event.target.checked);
    } else if (event.target.matches('[data-print-collection]')) {
      var collectionId = event.target.value;
      if (event.target.checked && !printCollectionSelected_(collectionId)) state.printCollectionIds.push(collectionId);
      if (!event.target.checked) state.printCollectionIds = state.printCollectionIds.filter(function (id) { return collectionKey_(id) !== collectionKey_(collectionId); });
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.name === 'print-scope') {
      state.printScope = event.target.value;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.name === 'print-format') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printFormat = event.target.value;
      return renderPrint();
    } else if (event.target.id === 'print-order') {
      state.printOrder = event.target.value;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.id === 'print-only-unprinted') {
      state.printOnlyUnprinted = event.target.checked;
      clearPrintResult_();
      return renderPrint();
    } else if (event.target.id === 'print-font-size') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printFontSize = Number(event.target.value);
      return renderPrint();
    } else if (event.target.id === 'print-line-height') {
      capturePrintPreview_();
      clearPrintDownload_();
      state.printLineHeight = Number(event.target.value);
      return renderPrint();
    } else if (event.target.matches('[data-phrase-filter]')) {
      var list = event.target.dataset.phraseFilter;
      var ids = list === 'manage' ? state.manageCollectionIds : state.session.collectionIds;
      if (event.target.checked) ids.push(event.target.value);
      else ids.splice(ids.indexOf(event.target.value), 1);
      document.getElementById(list + '-collection-summary').textContent = collectionFilterLabel_(ids);
      if (list === 'manage') { state.managePage = 1; renderManageList(); }
      else { refreshPractice_(); renderPracticeList(); }
    } else if (event.target.id === 'import-header') state.importHasHeader = event.target.checked;
    else if (event.target.name === 'delimiter') state.importDelimiter = event.target.value === 'tab' ? '\t' : ',';
    else if (/^import-(de|es|pronunciation|kana)$/.test(event.target.id)) state.importColumns[event.target.id.slice(7)] = Number(event.target.value);
    else if (event.target.id === 'session-order') { state.session.order = event.target.value; refreshPractice_(); renderPracticeList(); }
    else if (event.target.id === 'ssml-pause' || event.target.id === 'ssml-reps') {
      state.ssmlSettings[event.target.id.slice(5)] = Number(event.target.value);
      try { localStorage.setItem('sprache-lernen-ssml-settings', JSON.stringify(state.ssmlSettings)); } catch (err) {}
    }
  });
  el.app.addEventListener('toggle', function (event) {
    if (event.target.id === 'import-panel') state.importOpen = event.target.open;
    else if (event.target.id === 'ssml-options') state.session.ssmlOpen = event.target.open;
  }, true);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.editing !== null) { state.editing = null; state.editingCollectionIds = null; render(); }
    else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && state.editing !== null) { event.preventDefault(); savePhrase(); }
  });

  el.screen.innerHTML = '<div class="empty">Cargando frases…</div>';
  reload();
}());
</script>
</body>
</html>
