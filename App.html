<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#16202b; --paper:#fff; --surface:#f6f8fa; --rule:#dfe5ec; --muted:#64748b; --good:#0f766e; --good-soft:#e2f2f0; --bad:#b45309; --bad-soft:#fdf0dd; --danger:#b3261e; --focus:#2563eb; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--surface); color:var(--ink); }
  body { font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:7px 11px; }
  button:focus-visible,input:focus,textarea:focus,select:focus { outline:2px solid var(--focus); outline-offset:1px; }
  button:disabled { cursor:wait; opacity:.55; }
  input[type="text"],input[type="search"],textarea,select { width:100%; padding:8px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); }
  textarea { min-height:72px; resize:vertical; }
  #app { min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { font-weight:750; letter-spacing:-.01em; white-space:nowrap; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  .nav { background:transparent; color:var(--muted); font-weight:650; }
  .nav.on,.primary { background:var(--ink); color:#fff; font-weight:650; }
  .nav.on:hover,.primary:hover { background:#0d1620; }
  .screen { max-width:1180px; margin:0 auto; padding:20px; }
  .ghost { background:var(--paper); color:var(--ink); border-color:var(--rule); }
  .ghost:hover,.phrase-choice:hover,.history-card:hover { background:var(--surface); }
  .good { background:var(--good); color:#fff; font-weight:650; }
  .bad { background:var(--bad); color:#fff; font-weight:650; }
  .link { padding:3px 5px; background:transparent; color:var(--muted); text-decoration:underline; }
  .link:hover { color:var(--ink); }
  .danger { color:var(--danger); }
  .muted,.hint { color:var(--muted); }
  .hint { margin:5px 0 0; font-size:12px; }
  .section-title { margin:0; font-size:16px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .card,.panel { background:var(--paper); border:1px solid var(--rule); border-radius:9px; }
  .empty { padding:36px 16px; color:var(--muted); text-align:center; }
  .phrase-list,.history,.manage-list { overflow:hidden; }
  .pagination { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 14px; border-top:1px solid var(--rule); }
  .pagination .muted { margin-right:auto; font-size:12px; }
  .phrase-choice { display:block; width:100%; padding:14px 16px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .phrase-choice:last-child,.manage-item:last-child { border-bottom:0; }
  .id { display:block; margin-top:3px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .history .section-head { padding:14px 14px 0; }
  .history-list { max-height:calc(100vh - 170px); overflow-y:auto; }
  .history-card { display:block; width:100%; padding:10px 14px; border-width:1px 0 0; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .history-card p { margin:0 0 5px; }
  .history-meta { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
  .badge { border-radius:999px; padding:1px 7px; font-size:11px; font-weight:700; }
  .badge.good { background:var(--good-soft); color:var(--good); }
  .badge.bad { background:var(--bad-soft); color:var(--bad); }
  .study-tabs { display:flex; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--rule); }
  .study-tab { margin-bottom:-1px; border-color:transparent; border-radius:6px 6px 0 0; background:transparent; color:var(--muted); font-weight:650; }
  .study-tab.on { border-color:var(--rule); border-bottom-color:var(--paper); background:var(--paper); color:var(--ink); }
  .study-search { margin-bottom:12px; }
  .study-card { max-width:720px; margin:28px auto; padding:28px; text-align:center; }
  .question { margin:26px 0; font-size:clamp(24px,5vw,38px); line-height:1.25; font-weight:700; }
  .answer { margin:0 0 22px; font:28px/1.3 Georgia,"Times New Roman",serif; }
  .notes { margin:0 0 22px; color:var(--muted); }
  .study-actions,.form-actions { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  .manage-grid { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
  .manage-item { padding:14px 16px; border-bottom:1px solid var(--rule); }
  .manage-item h3 { margin:0; font:17px/1.3 Georgia,"Times New Roman",serif; }
  .manage-item p { margin:3px 0 0; color:var(--muted); }
  .manage-meta { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { border:1px solid var(--rule); border-radius:999px; color:var(--muted); padding:1px 7px; font-size:11px; }
  .print-status { display:flex; align-items:center; gap:5px; margin:0 4px 0 0; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; }
  .manage-side { display:grid; gap:20px; }
  .form-panel,.import-panel { padding:16px; }
  .field { margin-bottom:12px; }
  .ai-actions { display:flex; gap:8px; margin-top:7px; }
  .ai-result { margin:8px 0 0; padding:10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); white-space:pre-wrap; }
  label { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
  .import-options { display:flex; gap:14px; margin:9px 0; color:var(--muted); flex-wrap:wrap; }
  .import-options label { display:flex; align-items:center; gap:5px; margin:0; font-size:12px; letter-spacing:0; text-transform:none; }
  .mapping { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .preview { margin-top:12px; overflow-x:auto; }
  .collection-list { overflow:hidden; }
  .collection-choice { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .collection-choice:last-child { border-bottom:0; }
  .collection-choice:hover { background:var(--surface); }
  .collection-count { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
  .collection-player { margin:20px 0; }
  .player-progress { color:var(--muted); font-size:12px; }
  .player-settings { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:14px 0; text-align:left; }
  .collection-editor { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:20px; align-items:start; }
  .collection-members,.collection-candidates { overflow:hidden; }
  .collection-row { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--rule); }
  .collection-row:last-child { border-bottom:0; }
  .collection-row p { margin:2px 0 0; color:var(--muted); }
  .collection-candidates label.collection-row { color:var(--ink); font-size:14px; font-weight:400; letter-spacing:0; text-transform:none; }
  .collection-row-actions { display:flex; gap:3px; margin-left:auto; }
  .collection-picker { display:grid; gap:6px; max-height:180px; overflow:auto; padding:8px; border:1px solid var(--rule); border-radius:6px; }
  .collection-picker label { display:flex; align-items:center; gap:7px; margin:0; color:var(--ink); font-size:13px; font-weight:400; letter-spacing:0; text-transform:none; }
  .print-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start; }
  .print-panel { padding:16px; }
  .print-options { display:grid; gap:8px; }
  .print-option,.print-collection-row { display:flex; align-items:center; gap:8px; margin:0; color:var(--ink); font-size:14px; font-weight:400; letter-spacing:0; text-transform:none; }
  .print-option input,.print-collection-row input { width:auto; }
  .print-collection-list { overflow:hidden; margin-top:10px; }
  .print-collection-row { padding:10px 12px; border-bottom:1px solid var(--rule); }
  .print-collection-row:last-child { border-bottom:0; }
  .print-collection-row span:first-of-type { flex:1; }
  .print-order-list { display:grid; gap:6px; margin-top:10px; }
  .print-order-row { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); }
  .print-order-row span { flex:1; }
  .print-order-actions { display:flex; gap:3px; }
  .print-summary { margin:14px 0; padding:10px; border-radius:6px; background:var(--surface); color:var(--muted); }
  .print-settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .print-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .print-result { margin-top:16px; padding:12px; border:1px solid var(--rule); border-radius:7px; background:var(--good-soft); color:var(--good); }
  .print-result a { display:inline-block; margin-top:5px; color:inherit; font-weight:700; }
  .print-preview { margin-top:20px; }
  .print-preview-content { min-height:180px; max-height:720px; overflow:auto; padding:24px; border:1px solid var(--rule); border-radius:7px; background:#fff; color:#111; font-family:Georgia,"Times New Roman",serif; font-size:var(--material-size); line-height:var(--material-leading); }
  .print-preview-content:focus { outline:2px solid var(--focus); outline-offset:1px; }
  .print-preview-content h1 { margin:0 0 .25em; font-size:1.45em; line-height:1.15; }
  .print-preview-content h2 { margin:1.5em 0 .45em; font-size:1.1em; line-height:1.2; }
  .print-preview-content .material-meta { margin:0 0 1.5em; color:var(--muted); font: .65em/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .print-preview-content table { width:100%; border-collapse:collapse; table-layout:fixed; margin:0 0 1.4em; }
  .print-preview-content th,.print-preview-content td { padding:.65em .6em; border:1px solid #777; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
  .print-preview-content th { background:#eee; font:.72em/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .print-preview-content tr { break-inside:avoid; page-break-inside:avoid; }
  @media (max-width:760px) { .print-settings { grid-template-columns:1fr; } .print-preview-content { padding:16px; } }
  .session-layout { display:grid; grid-template-columns:270px minmax(0,1fr); gap:20px; align-items:start; }
  .session-controls { position:sticky; top:16px; padding:14px; text-align:left; }
  .session-controls.collapsed .session-control-body { display:none; }
  .session-control-head,.session-list-head,.session-choice { display:flex; align-items:center; gap:10px; }
  .session-control-head { justify-content:space-between; flex-wrap:wrap; }
  .session-control-head .study-actions { justify-content:flex-end; }
  .session-control-body { margin-top:14px; }
  .session-control-body .field { margin-bottom:10px; }
  .session-list { overflow:hidden; }
  .session-list-head { justify-content:space-between; flex-wrap:wrap; padding:13px 14px; border-bottom:1px solid var(--rule); }
  .session-language-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .session-choice { position:relative; min-height:68px; padding:0; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .session-choice:last-child { border-bottom:0; }
  .session-choice.on { background:var(--surface); }
  .session-choice.playing { box-shadow:inset 4px 0 var(--good); background:var(--good-soft); }
  .session-row-select { flex:1; min-width:0; padding:13px 14px; border:0; border-radius:0; background:transparent; color:inherit; text-align:left; }
  .session-row-select:hover { background:rgba(255,255,255,.38); }
  .session-row-de { display:block; font:18px/1.35 Georgia,"Times New Roman",serif; }
  .session-row-es { display:block; margin-top:3px; color:var(--muted); font-size:14px; }
  .session-row-meta { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
  .session-row-play { align-self:stretch; min-width:88px; border-width:0 0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); font-weight:650; }
  .session-choice.playing .session-row-play { background:var(--good); color:#fff; }
  .session-quick-control { display:flex; align-items:center; gap:8px; }
  .session-quick-control .primary { white-space:nowrap; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { padding:5px 6px; border:1px solid var(--rule); text-align:left; vertical-align:top; }
  #note { position:fixed; left:50%; bottom:18px; display:none; max-width:min(90vw,600px); padding:9px 13px; border-radius:7px; transform:translateX(-50%); box-shadow:0 4px 16px rgba(15,23,42,.16); }
  #note.show { display:block; }
  #note.ok { background:var(--good-soft); color:var(--good); }
  #note.err { background:#fdecea; color:var(--danger); }
  @media (max-width:760px) { .topbar { padding:10px 14px; flex-wrap:wrap; gap:8px; } .screen { padding:14px; } .manage-grid,.collection-editor,.session-layout,.print-grid { grid-template-columns:1fr; } .manage-side { order:-1; } .history-list { max-height:none; } .study-card { margin:8px 0; padding:22px 16px; } .collection-player { margin:8px 0; } .study-list-panel { padding-bottom:66px; } .study-random { position:fixed; right:14px; bottom:14px; left:14px; z-index:1; } .player-settings { grid-template-columns:1fr; } .session-controls { top:0; z-index:2; margin:0 -14px; border-width:0 0 1px; border-radius:0; } .session-controls.collapsed { padding:8px 14px; } .session-layout { gap:12px; } .session-list-head { align-items:flex-start; } .session-language-actions { max-width:190px; } .session-choice { min-height:72px; } .session-row-play { min-width:82px; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Frases en alemán</div>
    <nav aria-label="Secciones">
      <button class="nav" data-act="switch-view" data-view="study">Estudiar</button>
      <button class="nav" data-act="switch-view" data-view="collections">Colecciones</button>
      <button class="nav" data-act="switch-view" data-view="manage">Gestionar</button>
      <button class="nav" data-act="switch-view" data-view="print">Material</button>
      <button class="nav" data-act="switch-view" data-view="generate">Generar</button>
      <button class="nav" data-act="switch-view" data-view="etymology">Etimología</button>
    </nav>
    <button class="link" data-act="refresh-data">Actualizar datos</button>
  </header>
  <main class="screen" id="screen"></main>
  <div id="note" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    loadingData: false,
    items: [], history: [], view: 'study', detailId: null, revealed: false,
    saving: false, editing: null, editingCollectionIds: null, studyTab: 'phrases', studyPage: 1, studyQuery: '', managePage: 1, manageQuery: '', importText: '',
    importPreview: null, importHasHeader: true, importDelimiter: ',',
    generator: { context:'', items:[], collectionIds:[], busy:false, saving:false },
    etymologyText: '', etymologyResult: '',
    collections: [], memberIdsByCollection: {}, collectionsLoaded: false, collectionQuery: '', collectionId: null, collection: null, collectionEditor: null, collectionPhraseQuery: '', collectionPage: 1, collectionEditorPage: 1, collectionCandidatePage: 1, collectionSelection: {}, collectionPhraseDraft: false,
    printScope: 'all', printCollectionIds: [], printOnlyUnprinted: false, printOrder: 'manual', printFormat: 'html', printFontSize: 20, printLineHeight: 1.6, printRevision: 0, printGenerating: false, printPreviewLoading: false, printPreview: null, printResult: null,
    session: { phase:'free', order:'manual', items:[], supports:{ german:true, spanish:false }, controlsOpen:true, revealedIndex:null },
    playerSettings: playerSettings_()
  };
  var player = { index:0, repetition:0, playing:false, timer:null, token:0, voice:null, uiIndex:null };
  var PAGE_SIZE = 25;
  var el = {
    app: document.getElementById('app'), screen: document.getElementById('screen'),
    note: document.getElementById('note')
  };
  var ALL_COLLECTION_ID = '__all__';

  function collectionKey_(id) { return String(id || '').toUpperCase(); }

  function collectionById_(id) {
    var key = collectionKey_(id);
    return state.collections.find(function (item) { return collectionKey_(item.id) === key; }) || null;
  }

  function assignedPhraseIds_() {
    var assigned = {};
    Object.keys(state.memberIdsByCollection).forEach(function (key) {
      state.memberIdsByCollection[key].forEach(function (id) { assigned[collectionKey_(id)] = true; });
    });
    return assigned;
  }

  function collectionIdsForPhrase_(phraseId) {
    var phraseKey = collectionKey_(phraseId);
    return Object.keys(state.memberIdsByCollection).filter(function (collectionKey) {
      return state.memberIdsByCollection[collectionKey].some(function (id) { return collectionKey_(id) === phraseKey; });
    }).map(function (collectionKey) {
      var collection = collectionById_(collectionKey);
      return collection && collection.id;
    }).filter(Boolean);
  }

  function setPhraseCollectionIds_(phraseId, collectionIds) {
    var phraseKey = collectionKey_(phraseId);
    var selected = {};
    (collectionIds || []).forEach(function (id) { selected[collectionKey_(id)] = true; });
    Object.keys(state.memberIdsByCollection).forEach(function (collectionKey) {
      var ids = state.memberIdsByCollection[collectionKey];
      var hasPhrase = ids.some(function (id) { return collectionKey_(id) === phraseKey; });
      if (hasPhrase && !selected[collectionKey]) {
        state.memberIdsByCollection[collectionKey] = ids.filter(function (id) { return collectionKey_(id) !== phraseKey; });
      } else if (!hasPhrase && selected[collectionKey]) {
        ids.push(phraseId);
      }
    });
  }

  function decorateCollections_() {
    var names = {};
    var counts = {};
    Object.keys(state.memberIdsByCollection).forEach(function (key) {
      var collection = collectionById_(key);
      if (!collection) return;
      state.memberIdsByCollection[key].forEach(function (id) {
        var phraseKey = collectionKey_(id);
        if (!names[phraseKey]) names[phraseKey] = [];
        names[phraseKey].push(collection.name);
        counts[key] = (counts[key] || 0) + 1;
      });
    });
    var assigned = assignedPhraseIds_();
    state.items.forEach(function (item) { item.collections = names[collectionKey_(item.id)] || []; });
    state.collections.forEach(function (collection) {
      collection.count = collection.unassigned
        ? state.items.filter(function (item) { return !assigned[collectionKey_(item.id)]; }).length
        : (counts[collectionKey_(collection.id)] || 0);
    });
  }

  function localCollection_(id) {
    if (collectionKey_(id) === collectionKey_(ALL_COLLECTION_ID)) {
      return { collection:{ id:ALL_COLLECTION_ID, name:'Todas', count:state.items.length, all:true }, items:state.items.slice() };
    }
    var collection = collectionById_(id);
    if (!collection) return null;
    var assigned = assignedPhraseIds_();
    var ids = collection.unassigned
      ? state.items.filter(function (item) { return !assigned[collectionKey_(item.id)]; }).map(function (item) { return item.id; })
      : (state.memberIdsByCollection[collectionKey_(id)] || []);
    var items = ids.map(byId).filter(Boolean);
    if (collection.unassigned) items.sort(function (a, b) { return b.id.localeCompare(a.id); });
    return { collection: collection, items: items };
  }

  function refreshOpenCollection_() {
    if (!state.collectionId) return;
    state.collection = localCollection_(state.collectionId);
    resetSession_('free', 'manual', true);
  }

  function applyAppData_(data) {
    state.items = data.items || [];
    state.history = data.history || [];
    state.collections = data.collections || [];
    state.memberIdsByCollection = data.memberIdsByCollection || {};
    state.collections.forEach(function (collection) {
      if (!collection.unassigned && !state.memberIdsByCollection[collectionKey_(collection.id)]) {
        state.memberIdsByCollection[collectionKey_(collection.id)] = [];
      }
    });
    state.collectionsLoaded = true;
    state.printCollectionIds = state.printCollectionIds.filter(function (id) {
      return collectionKey_(id) === collectionKey_('__unassigned__') || !!collectionById_(id);
    });
    decorateCollections_();
    if (state.editing && byId(state.editing)) state.editingCollectionIds = collectionIdsForPhrase_(state.editing);
    if (state.collectionId) state.collection = localCollection_(state.collectionId);
  }

  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function say(message, kind) {
    el.note.textContent = message;
    el.note.className = 'show ' + (kind || 'ok');
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { el.note.className = ''; }, 3500);
  }

  function playerSettings_() {
    var defaults = { rate:1, pause:1000, reps:1 };
    try {
      var saved = JSON.parse(localStorage.getItem('deutsch-player-settings') || '{}');
      if ([0.75, 1, 1.25].indexOf(Number(saved.rate)) !== -1) defaults.rate = Number(saved.rate);
      if ([1000, 2000, 3000, 5000].indexOf(Number(saved.pause)) !== -1) defaults.pause = Number(saved.pause);
      if ([1, 2, 3, 4, 5].indexOf(Number(saved.reps)) !== -1) defaults.reps = Number(saved.reps);
    } catch (err) {}
    return defaults;
  }

  function savePlayerSettings_() {
    try { localStorage.setItem('deutsch-player-settings', JSON.stringify(state.playerSettings)); } catch (err) {}
  }

  function germanVoice_() {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return null;
    var voices = window.speechSynthesis.getVoices();
    function language(voice) { return String(voice.lang || '').toLowerCase().replace('_', '-'); }
    var exact = voices.find(function (voice) { return language(voice) === 'de-de'; });
    return exact || voices.find(function (voice) { return language(voice).indexOf('de') === 0; }) || null;
  }

  function phaseDefaults_(phase) {
    if (phase === 'understand') return { german:true, spanish:true };
    if (phase === 'listen') return { german:false, spanish:false };
    if (phase === 'shadow') return { german:true, spanish:false };
    if (phase === 'recall') return { german:false, spanish:true };
    return { german:true, spanish:false };
  }

  function shuffledItems_(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled;
  }

  function sessionItems_() {
    return state.session.items;
  }

  function resetPhraseSupports_() {
    state.session.supports = phaseDefaults_(state.session.phase);
    state.session.revealedIndex = null;
  }

  function resetSession_(phase, order, resetSupports) {
    var phaseChanged = phase && phase !== state.session.phase;
    state.session.phase = phase || state.session.phase;
    state.session.order = order || state.session.order;
    var items = state.collection ? state.collection.items : [];
    state.session.items = state.session.order === 'random' ? shuffledItems_(items) : items.slice();
    player.index = 0;
    player.repetition = 0;
    state.collectionPage = 1;
    if (resetSupports || phaseChanged) resetPhraseSupports_(); else state.session.revealedIndex = null;
  }

  function currentPlayerItem_() {
    return sessionItems_()[player.index] || null;
  }

  function nextPlaybackPosition(length, index, repetition, repetitions) {
    repetition++;
    if (repetition >= repetitions) return { index:(index + 1) % length, repetition:0 };
    return { index:index, repetition:repetition };
  }

  function playerVoiceReady_() {
    player.voice = germanVoice_();
    return player.voice;
  }

  function recallPhase_() {
    return state.session.phase === 'recall';
  }

  function germanVisible_(index) {
    return recallPhase_() ? state.session.revealedIndex === index : state.session.supports.german;
  }

  function currentAudioAvailable_() {
    return !!currentPlayerItem_() && (!recallPhase_() || germanVisible_(player.index));
  }

  function replaceSessionRow_(index) {
    var item = sessionItems_()[index];
    var row = document.querySelector('#session-list .session-choice[data-index="' + index + '"]');
    if (item && row) row.outerHTML = sessionRowHtml_(item, index);
  }

  function updateSessionRows_(scrollActive) {
    var activePage = Math.floor(player.index / PAGE_SIZE) + 1;
    if (state.collectionPage !== activePage && scrollActive) {
      state.collectionPage = activePage;
      return renderCollections();
    }
    if (player.uiIndex !== player.index) replaceSessionRow_(player.uiIndex);
    replaceSessionRow_(player.index);
    player.uiIndex = player.index;
    var active = document.querySelector('#session-list .session-choice[data-index="' + player.index + '"]');
    if (scrollActive && active && active.scrollIntoView) active.scrollIntoView({ block:'center', behavior:'smooth' });
  }

  function redrawSessionRows_() {
    var list = document.getElementById('session-list');
    if (list) list.innerHTML = sessionListHtml_();
    player.uiIndex = player.index;
  }

  function updatePlayerUi_(scrollActive) {
    var item = currentPlayerItem_();
    var progress = document.getElementById('player-progress');
    var quick = document.getElementById('session-quick-control');
    var germanSupport = document.getElementById('support-german');
    var spanishSupport = document.getElementById('support-spanish');
    var items = sessionItems_();
    playerVoiceReady_();
    if (progress) progress.textContent = item ? (player.index + 1) + ' de ' + items.length : '';
    if (quick) quick.innerHTML = sessionQuickControlHtml_();
    if (germanSupport) germanSupport.textContent = recallPhase_() ? (germanVisible_(player.index) ? 'Ocultar alemán' : 'Revelar alemán') : (state.session.supports.german ? 'Ocultar alemán' : 'Mostrar alemán');
    if (spanishSupport) spanishSupport.textContent = state.session.supports.spanish ? 'Ocultar español' : 'Mostrar español';
    updateSessionRows_(scrollActive);
  }

  function stopPlayer_() {
    player.playing = false;
    player.token++;
    if (player.timer) clearTimeout(player.timer);
    player.timer = null;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    updatePlayerUi_();
  }

  function playPlayerCycle_(token) {
    if (!player.playing || token !== player.token) return;
    var item = currentPlayerItem_();
    if (!item || !playerVoiceReady_()) return stopPlayer_();

    var utterance = new SpeechSynthesisUtterance(item.de);
    utterance.lang = player.voice.lang || 'de-DE';
    utterance.voice = player.voice;
    utterance.rate = state.playerSettings.rate;
    utterance.onend = function () {
      if (!player.playing || token !== player.token) return;
      player.timer = setTimeout(function () {
        if (!player.playing || token !== player.token) return;
        if (recallPhase_() && player.repetition + 1 >= state.playerSettings.reps) {
          player.playing = false;
          player.repetition = 0;
          player.timer = null;
          return updatePlayerUi_();
        }
        var next = nextPlaybackPosition(sessionItems_().length, player.index, player.repetition, state.playerSettings.reps);
        player.index = next.index;
        player.repetition = next.repetition;
        player.timer = null;
        updatePlayerUi_(next.repetition === 0);
        playPlayerCycle_(token);
      }, state.playerSettings.pause);
    };
    utterance.onerror = function (event) {
      if (!player.playing || token !== player.token || event.error === 'canceled' || event.error === 'interrupted') return;
      stopPlayer_();
      say('No se pudo reproducir la voz alemana.', 'err');
    };
    updatePlayerUi_();
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  function startPlayer_() {
    if (!sessionItems_().length || (recallPhase_() && !state.session.supports.german)) return;
    if (!playerVoiceReady_()) { updatePlayerUi_(); return; }
    player.playing = true;
    var token = ++player.token;
    playPlayerCycle_(token);
  }

  function togglePlayer_() {
    if (player.playing) stopPlayer_(); else startPlayer_();
  }

  function movePlayer_(direction) {
    if (!sessionItems_().length) return;
    var resume = player.playing;
    stopPlayer_();
    player.index = (player.index + direction + sessionItems_().length) % sessionItems_().length;
    player.repetition = 0;
    if (recallPhase_()) state.session.revealedIndex = null;
    updatePlayerUi_(true);
    if (resume && !recallPhase_()) startPlayer_();
  }

  function restartPlayer_() {
    var resume = player.playing;
    stopPlayer_();
    player.repetition = 0;
    updatePlayerUi_();
    if (resume) startPlayer_();
  }

  function restartSession_() {
    var resume = player.playing;
    stopPlayer_();
    player.index = 0;
    player.repetition = 0;
    if (recallPhase_()) state.session.revealedIndex = null;
    updatePlayerUi_(true);
    if (resume && !recallPhase_()) startPlayer_();
  }

  function setPlayerSetting_(name, value) {
    var next = Number(value);
    if (state.playerSettings[name] === next) return;
    var resume = player.playing;
    stopPlayer_();
    state.playerSettings[name] = next;
    savePlayerSettings_();
    updatePlayerUi_();
    if (resume) startPlayer_();
  }

  function setPhase_(phase) {
    stopPlayer_();
    resetSession_(phase, state.session.order, true);
    renderCollections();
  }

  function setSessionOrder_(order) {
    stopPlayer_();
    resetSession_(state.session.phase, order, false);
    renderCollections();
  }

  function selectSessionItem_(index) {
    if (index < 0 || index >= sessionItems_().length) return;
    stopPlayer_();
    player.index = index;
    player.repetition = 0;
    if (recallPhase_()) state.session.revealedIndex = null;
    updatePlayerUi_(true);
    if (!recallPhase_()) startPlayer_();
  }

  function toggleSessionItem_(index) {
    if (index !== player.index) return selectSessionItem_(index);
    togglePlayer_();
  }

  function toggleSupport_(support) {
    if (recallPhase_() && support === 'german') {
      if (germanVisible_(player.index)) {
        stopPlayer_();
        state.session.revealedIndex = null;
      } else state.session.revealedIndex = player.index;
      return updatePlayerUi_();
    }
    state.session.supports[support] = !state.session.supports[support];
    redrawSessionRows_();
    updatePlayerUi_();
  }

  function byId(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) return state.items[i];
    }
    return null;
  }

  function randomCandidate(items, history) {
    var recent = {};
    history.forEach(function (entry) { recent[entry.id] = true; });
    var candidates = items.filter(function (item) { return !recent[item.id]; });
    return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
  }

  function dateLabel(value) {
    var date = new Date(value);
    return isNaN(date.getTime()) ? '' : date.toLocaleString('es-AR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }

  function phrasesToText(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled.map(function (item) {
      return String(item.de == null ? '' : item.de).trim().replace(/\s+/g, ' ');
    }).filter(Boolean).map(function (text) {
      return /[.!?…]$/.test(text) ? text : text + '.';
    }).join('\n\n');
  }

  function sessionToSsmlText_(items, reps, pause) {
    var breakTag = '<break time="' + (Number(pause) / 1000) + 's" />';
    var blocks = [];
    items.forEach(function (item) {
      var text = String(item.de == null ? '' : item.de).trim().replace(/\s+/g, ' ');
      for (var repeat = 0; text && repeat < reps; repeat++) blocks.push(text, breakTag);
    });
    return blocks.join('\n\n');
  }

  function fallbackCopyText(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var copied = document.execCommand('copy');
    area.remove();
    if (!copied) throw new Error('No se pudo acceder al portapapeles.');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { fallbackCopyText(text); });
    }
    fallbackCopyText(text);
    return Promise.resolve();
  }

  function copySessionSsml_() {
    var text = sessionToSsmlText_(sessionItems_(), state.playerSettings.reps, state.playerSettings.pause);
    if (!text) return say('No hay frases en esta colección para copiar.', 'err');
    return copyText(text).then(function () { say('Guion SSML copiado.'); }).catch(function () { say('No se pudo copiar el guion SSML.', 'err'); });
  }

  function matchingItems(items, query) {
    query = String(query || '').toLowerCase();
    if (!query) return items;
    return items.filter(function (item) {
      return (item.id + ' ' + item.de + ' ' + item.es + ' ' + item.notes + ' ' +
        item.tags.join(' ')).toLowerCase().indexOf(query) !== -1;
    });
  }

  function managedItems() {
    return matchingItems(state.items, state.manageQuery);
  }

  function studyItems() {
    return matchingItems(state.items, state.studyQuery);
  }

  function paginate(items, requestedPage) {
    var total = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    var page = Math.min(Math.max(1, requestedPage), total);
    return { items:items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), page:page, total:total };
  }

  function paginationHtml(list, page) {
    if (page.total === 1) return '';
    return '<div class="pagination" aria-label="Paginación"><span class="muted">Página ' + page.page + ' de ' + page.total + '</span>' +
      '<button class="ghost" data-act="page" data-list="' + list + '" data-direction="-1"' + (page.page === 1 ? ' disabled' : '') + '>Anterior</button>' +
      '<button class="ghost" data-act="page" data-list="' + list + '" data-direction="1"' + (page.page === page.total ? ' disabled' : '') + '>Siguiente</button></div>';
  }

  function historyHtml() {
    if (!state.history.length) return '<div class="empty">Todavía no estudiaste frases.</div>';
    var cards = state.history.map(function (entry) {
      var item = byId(entry.id);
      if (!item) return '';
      return '<button class="history-card" data-act="study" data-id="' + esc(item.id) + '">' +
        '<p>' + esc(item.es || 'Sin traducción') + '</p><span class="history-meta">' +
        '<span class="badge ' + (entry.correct ? 'good' : 'bad') + '">' +
        (entry.correct ? 'Bien' : 'Mal') + '</span>' + esc(dateLabel(entry.reviewedAt)) +
        '</span></button>';
    }).join('');
    return cards || '<div class="empty">No hay frases disponibles.</div>';
  }

  function historyPanelHtml() {
    return '<section class="card history" id="history-panel"><div class="section-head"><h2 class="section-title">Últimas 20</h2><span class="muted">' +
      state.history.length + '/20</span></div><div class="history-list">' + historyHtml() + '</div></section>';
  }

  function studyListHtml() {
    if (!state.items.length) {
      return '<div class="empty"><p>No hay frases cargadas.</p>' +
        '<button class="primary" data-act="switch-view" data-view="manage">Agregar frases</button></div>';
    }
    var items = studyItems();
    if (!items.length) return '<div class="empty">No hay frases que coincidan.</div>';
    var page = paginate(items, state.studyPage);
    state.studyPage = page.page;
    return page.items.map(function (item) {
      return '<button class="phrase-choice" data-act="study" data-id="' + esc(item.id) + '">' +
        esc(item.es || 'Sin traducción') + '</button>';
    }).join('');
  }

  function studyPaginationHtml() {
    var page = paginate(studyItems(), state.studyPage);
    state.studyPage = page.page;
    return paginationHtml('study', page);
  }

  function studyTabsHtml() {
    return '<div class="study-tabs" role="group" aria-label="Modo estudio">' +
      '<button class="study-tab' + (state.studyTab === 'phrases' ? ' on' : '') + '" aria-pressed="' + (state.studyTab === 'phrases') + '" data-act="study-tab" data-tab="phrases">Frases</button>' +
      '<button class="study-tab' + (state.studyTab === 'history' ? ' on' : '') + '" aria-pressed="' + (state.studyTab === 'history') + '" data-act="study-tab" data-tab="history">Historial</button></div>';
  }

  function studyListPanelHtml() {
    return '<section class="study-list-panel" id="study-phrases"><div class="section-head"><h1 class="section-title">Elegí una frase</h1><button class="primary study-random" data-act="random">Random</button></div>' +
      '<input class="study-search" id="study-search" type="search" placeholder="Buscar frases…" value="' + esc(state.studyQuery) + '"><div class="card phrase-list" id="study-list">' + studyListHtml() + studyPaginationHtml() + '</div></section>';
  }

  function renderStudyList() {
    var target = document.getElementById('study-list');
    if (target) target.innerHTML = studyListHtml() + studyPaginationHtml();
  }

  function renderStudy() {
    var item = state.detailId ? byId(state.detailId) : null;
    if (state.detailId && !item) { state.detailId = null; state.revealed = false; }
    var content;
    if (state.studyTab === 'history') content = historyPanelHtml();
    else if (item) {
      content = '<section class="card study-card" id="study-phrases"><button class="link" data-act="back-study">← Volver al listado</button>' +
        '<p class="question">' + esc(item.es || 'Sin traducción') + '</p>' +
        (state.revealed
          ? '<p class="answer">' + esc(item.de) + '</p>' + (item.notes ? '<p class="notes">' + esc(item.notes) + '</p>' : '') +
            '<div class="study-actions"><button class="good" data-act="result" data-correct="true"' + (state.saving ? ' disabled' : '') + '>Lo hice bien</button>' +
            '<button class="bad" data-act="result" data-correct="false"' + (state.saving ? ' disabled' : '') + '>Me costó</button><button class="ghost" data-act="edit" data-id="' + esc(item.id) + '">Editar frase</button></div>'
          : '<div class="study-actions"><button class="primary" data-act="reveal">Ver alemán</button></div>') +
        '</section>';
    } else content = studyListPanelHtml();
    el.screen.innerHTML = '<div class="study">' + studyTabsHtml() + content + '</div>';
  }

  function phraseCollectionPickerHtml_(selectedIds) {
    var selected = {};
    selectedIds.forEach(function (id) { selected[collectionKey_(id)] = true; });
    var options = state.collections.filter(function (collection) { return !collection.unassigned; }).map(function (collection) {
      return '<label><input type="checkbox" name="phrase-collection" value="' + esc(collection.id) + '"' + (selected[collectionKey_(collection.id)] ? ' checked' : '') + '> ' + esc(collection.name) + '</label>';
    }).join('');
    return '<div class="field"><label>Colecciones</label>' +
      (options ? '<div class="collection-picker">' + options + '</div>' : '<p class="hint">Creá una colección para poder asignarla.</p>') + '</div>';
  }

  function phraseEditorHtml_(item, collectionId) {
    var inCollection = !!collectionId;
    var selectedIds = inCollection ? [collectionId] : (item ? collectionIdsForPhrase_(item.id) : []);
    return '<section class="panel form-panel"><div class="section-head"><h2 class="section-title">' + (item ? 'Editar ' + esc(item.id) : 'Nueva frase') + '</h2></div>' +
      '<div class="field"><label for="f-de">Frase en alemán</label><textarea id="f-de">' + esc(item ? item.de : '') + '</textarea><div class="ai-actions"><button id="ai-translate-to-es" class="ghost" data-act="translate-to-es">Traducir al español</button></div></div>' +
      '<div class="field"><label for="f-es">Traducción al español</label><textarea id="f-es">' + esc(item ? item.es : '') + '</textarea><div class="ai-actions"><button id="ai-translate" class="ghost" data-act="translate">Traducir al alemán</button></div></div>' +
      '<div class="field"><label for="f-notes">Notas</label><input id="f-notes" type="text" value="' + esc(item ? item.notes : '') + '"></div>' +
      '<div class="field"><label for="f-tags">Etiquetas</label><input id="f-tags" type="text" value="' + esc(item ? item.tags.join(', ') : '') + '" placeholder="viaje, trabajo, A2"></div>' +
      (inCollection ? '<p class="hint">Se agregará a ' + esc(collectionById_(collectionId).name) + '.</p>' : phraseCollectionPickerHtml_(selectedIds)) +
      '<div class="form-actions"><button class="primary" data-act="save-phrase">' + (item ? 'Guardar cambios' : 'Agregar frase') + '</button><button class="ghost" data-act="' + (inCollection ? 'cancel-collection-phrase' : 'cancel-editor') + '">Cancelar</button></div></section>';
  }

  function editorHtml() {
    var item = state.editing ? byId(state.editing) : null;
    if (state.editing === null) {
      return '<section class="panel form-panel"><div class="section-head"><h2 class="section-title">Frases</h2><button class="primary" data-act="new">Nueva frase</button></div>' +
        '<p class="hint">Las frases nuevas se pueden cargar una por una o importar abajo.</p></section>';
    }
    return phraseEditorHtml_(item, null);
  }

  function optionHtml(count) {
    var options = '';
    for (var i = 0; i < count; i++) options += '<option value="' + i + '">Columna ' + (i + 1) + '</option>';
    return options;
  }

  function importHtml() {
    var preview = state.importPreview;
    var rows = preview ? preview.data.rows.map(function (row) {
      var cells = '';
      for (var i = 0; i < preview.data.columnCount; i++) cells += '<td>' + esc(row[i] || '') + '</td>';
      return '<tr>' + cells + '</tr>';
    }).join('') : '';
    return '<section class="panel import-panel"><h2 class="section-title">Importar CSV / TSV</h2><p class="hint">Pegá el contenido, elegí el separador y mapeá alemán y español.</p>' +
      '<textarea id="import-text" placeholder="Deutsch,Español\nGuten Morgen,Buenos días">' + esc(state.importText) + '</textarea><div class="import-options">' +
      '<label><input type="radio" name="delimiter" value=","' + (state.importDelimiter === ',' ? ' checked' : '') + '> Coma</label>' +
      '<label><input type="radio" name="delimiter" value="tab"' + (state.importDelimiter === '\t' ? ' checked' : '') + '> Tab</label>' +
      '<label><input id="import-header" type="checkbox"' + (state.importHasHeader ? ' checked' : '') + '> Primera fila: encabezados</label></div><button class="ghost" data-act="preview-import">Ver vista previa</button>' +
      (preview ? '<div class="preview"><div class="mapping"><div><label for="import-de">Columna alemana</label><select id="import-de">' + optionHtml(preview.data.columnCount) + '</select></div>' +
        '<div><label for="import-es">Columna española</label><select id="import-es">' + optionHtml(preview.data.columnCount) + '</select></div></div><table><tbody>' + rows + '</tbody></table>' +
        '<div class="form-actions" style="margin-top:12px"><button class="primary" data-act="import">Importar</button></div></div>' : '') + '</section>';
  }

  function manageListHtml() {
    var items = managedItems();
    if (!items.length) return '<div class="empty">No hay frases que coincidan.</div>';
    var page = paginate(items, state.managePage);
    state.managePage = page.page;
    return page.items.map(function (item) {
      return '<article class="manage-item"><h3>' + esc(item.de) + '</h3><p>' + esc(item.es || 'Sin traducción') + '</p>' +
        (item.notes ? '<p class="hint">' + esc(item.notes) + '</p>' : '') + '<div class="manage-meta">' +
        item.tags.map(function (tag) { return '<span class="tag">#' + esc(tag) + '</span>'; }).join('') +
        '<label class="print-status"><input type="checkbox" data-print-status data-id="' + esc(item.id) + '"' + (item.printedAt ? ' checked' : '') + '> Incluida en material</label>' +
        '<span class="muted">' + esc(item.id) + '</span><span style="flex:1"></span><button class="link" data-act="edit" data-id="' + esc(item.id) + '">Editar</button>' +
        '<button class="link danger" data-act="delete" data-id="' + esc(item.id) + '">Borrar</button></div></article>';
    }).join('') + paginationHtml('manage', page);
  }

  function renderManageList() {
    var target = document.getElementById('manage-list');
    if (target) target.innerHTML = manageListHtml();
  }

  function renderManage() {
    el.screen.innerHTML = '<div class="manage-grid"><section><div class="section-head"><h1 class="section-title">Gestionar frases</h1><button class="ghost" data-act="copy">Copiar alemán al azar</button></div>' +
      '<input id="manage-search" type="search" placeholder="Buscar frases…" value="' + esc(state.manageQuery) + '"><div class="card manage-list" id="manage-list">' + manageListHtml() + '</div></section>' +
      '<aside class="manage-side">' + editorHtml() + importHtml() + '</aside></div>';
  }

  function printableCollections_() {
    return state.collections.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function printCollectionSelected_(id) {
    return state.printCollectionIds.some(function (selectedId) { return collectionKey_(selectedId) === collectionKey_(id); });
  }

  function printEstimate_() {
    var items = state.printScope === 'all' ? state.items.slice() : [];
    var unique = {};
    var rows = 0;
    if (state.printScope === 'all') {
      items.forEach(function (item) {
        if (!state.printOnlyUnprinted || !item.printedAt) unique[collectionKey_(item.id)] = true;
      });
      rows = Object.keys(unique).length;
    } else {
      state.printCollectionIds.forEach(function (id) {
        var collection = localCollection_(id);
        if (!collection) return;
        collection.items.forEach(function (item) {
          if (state.printOnlyUnprinted && item.printedAt) return;
          rows++;
          unique[collectionKey_(item.id)] = true;
        });
      });
    }
    return { rows:rows, unique:Object.keys(unique).length };
  }

  function printCollectionOptionsHtml_() {
    var disabled = state.printGenerating ? ' disabled' : '';
    var options = printableCollections_().map(function (collection) {
      return '<label class="print-collection-row"><input type="checkbox" data-print-collection value="' + esc(collection.id) + '"' + disabled +
        (printCollectionSelected_(collection.id) ? ' checked' : '') + '><span>' + esc(collection.name) + '</span><span class="muted">' + collection.count + '</span></label>';
    }).join('');
    return options || '<div class="empty">Todavía no hay colecciones.</div>';
  }

  function printOrderHtml_() {
    var disabled = state.printGenerating ? ' disabled' : '';

  function printSummaryHtml_() {
    var estimate = printEstimate_();
    if (!estimate.unique) return '<div class="print-summary">No hay frases que coincidan con esta selección.</div>';

  function capturePrintPreview_() {
    var preview = document.getElementById('print-preview-content');
    if (preview && state.printPreview) state.printPreview.body = preview.innerHTML;
  }

  function printPreviewHtml_() {
    if (state.printFormat !== 'html') return '';
    if (!state.printPreview) return '<div class="print-summary">Previsualizá el material para editarlo antes de descargarlo.</div>';
    return '<div class="print-preview"><div class="section-head"><h2 class="section-title">Vista previa editable</h2><span class="hint">Hacé clic en el texto o las celdas para corregirlo.</span></div><div id="print-preview-content" class="print-preview-content" contenteditable="' + (state.printGenerating ? 'false' : 'true') + '" spellcheck="false" style="--material-size:' + state.printFontSize + 'px;--material-leading:' + state.printLineHeight + '">' + state.printPreview.body + '</div></div>';
  }

  function clearPrintDownload_() {
    if (state.printResult && state.printResult.url && window.URL && window.URL.revokeObjectURL) {
      window.URL.revokeObjectURL(state.printResult.url);
    }
    state.printResult = null;
  }

  function clearPrintResult_() {
    state.printRevision++;
    clearPrintDownload_();
    state.printPreviewLoading = false;
    state.printPreview = null;
  }

  function renderPrint() {
    var collections = state.printScope === 'collections';
    var result = state.printResult;
    var estimate = printEstimate_();
    var buttonLabel = state.printGenerating ? 'Generando material…' : (state.printFormat === 'html' ? 'Descargar HTML' : 'Descargar Markdown');
    var disabled = state.printGenerating ? ' disabled' : '';
    el.screen.innerHTML = '<div class="print-grid"><section class="panel print-panel"><div class="section-head"><h1 class="section-title">Material de estudio</h1></div>' +
      '<p class="hint">HTML mantiene el tamaño de letra y la tabla al abrirlo en el ebook o al imprimirlo. También podés editar la vista previa.</p>' +
      '<div class="field"><label>Qué incluir</label><div class="print-options">' +
      '<label class="print-option"><input type="radio" name="print-scope" value="all"' + disabled + (state.printScope === 'all' ? ' checked' : '') + '> Todas las frases</label>' +
      '<label class="print-option"><input type="radio" name="print-scope" value="collections"' + disabled + (collections ? ' checked' : '') + '> Colecciones seleccionadas</label></div></div>' +
      (collections ? '<div class="section-head"><h2 class="section-title">Colecciones</h2><span><button class="link" data-act="select-all-print-collections"' + disabled + '>Todas</button><button class="link" data-act="clear-print-collections"' + disabled + '>Limpiar</button></span></div><div class="card print-collection-list">' + printCollectionOptionsHtml_() + '</div><h2 class="section-title" style="margin-top:18px">Orden de colecciones</h2><p class="hint">Este orden sólo se aplica a este archivo.</p><div class="print-order-list">' + printOrderHtml_() + '</div>' : '') +
      '<div class="field" style="margin-top:18px"><label for="print-order">Orden de frases</label><select id="print-order"' + disabled + '><option value="manual"' + (state.printOrder === 'manual' ? ' selected' : '') + '>Orden actual</option><option value="random"' + (state.printOrder === 'random' ? ' selected' : '') + '>Aleatorio</option></select></div>' +
      '<label class="print-option"><input id="print-only-unprinted" type="checkbox"' + disabled + (state.printOnlyUnprinted ? ' checked' : '') + '> Sólo frases no incluidas en material</label>' +
      '<div class="field" style="margin-top:18px"><label>Formato</label><div class="print-options"><label class="print-option"><input type="radio" name="print-format" value="html"' + disabled + (state.printFormat === 'html' ? ' checked' : '') + '> HTML editable (recomendado)</label><label class="print-option"><input type="radio" name="print-format" value="markdown"' + disabled + (state.printFormat === 'markdown' ? ' checked' : '') + '> Markdown</label></div></div>' +
      (state.printFormat === 'html' ? '<div class="print-settings"><div class="field"><label for="print-font-size">Tamaño de letra</label><select id="print-font-size"' + disabled + '><option value="18"' + (state.printFontSize === 18 ? ' selected' : '') + '>18 px</option><option value="20"' + (state.printFontSize === 20 ? ' selected' : '') + '>20 px</option><option value="22"' + (state.printFontSize === 22 ? ' selected' : '') + '>22 px</option><option value="24"' + (state.printFontSize === 24 ? ' selected' : '') + '>24 px</option></select></div><div class="field"><label for="print-line-height">Espaciado</label><select id="print-line-height"' + disabled + '><option value="1.4"' + (state.printLineHeight === 1.4 ? ' selected' : '') + '>Compacto</option><option value="1.6"' + (state.printLineHeight === 1.6 ? ' selected' : '') + '>Cómodo</option><option value="1.8"' + (state.printLineHeight === 1.8 ? ' selected' : '') + '>Amplio</option><option value="2"' + (state.printLineHeight === 2 ? ' selected' : '') + '>Muy amplio</option></select></div></div>' : '') +
      printSummaryHtml_() + '<div class="print-actions"><button class="ghost" data-act="preview-material"' + (state.printPreviewLoading || state.printGenerating || !estimate.unique ? ' disabled' : '') + '>' + (state.printPreviewLoading ? 'Preparando vista previa…' : 'Previsualizar') + '</button><button class="primary" data-act="generate-material"' + (state.printGenerating || !estimate.unique ? ' disabled' : '') + '>' + buttonLabel + '</button></div>' +
      (result ? '<div class="print-result">Material descargado: ' + result.includedCount + ' frases distintas' + (result.rowCount !== result.includedCount ? ' · ' + result.rowCount + ' filas' : '') + '.<br><a href="' + esc(result.url) + '" download="' + esc(result.name) + '">Volver a descargar ' + esc(result.name) + '</a></div>' : '') +
      printPreviewHtml_() + '</section><aside class="panel print-panel"><h2 class="section-title">Cómo funciona</h2><p class="hint">Cada colección aparece en su propio bloque con una tabla de dos columnas. Las frases sin traducción quedan con la celda española vacía.</p><p class="hint">Al descargarlo, las frases incluidas quedan marcadas con la fecha de generación. Podés corregir esa marca desde Gestionar.</p></aside></div>';
  }

  function selectAllPrintCollections_() {
    if (state.printGenerating) return;
    state.printCollectionIds = printableCollections_().map(function (collection) { return collection.id; });
    clearPrintResult_();
    renderPrint();
  }

  function clearPrintCollections_() {
    if (state.printGenerating) return;
    state.printCollectionIds = [];
    clearPrintResult_();
    renderPrint();
  }

  function movePrintCollection_(index, direction) {
    if (state.printGenerating) return;
    var next = index + direction;
    if (index < 0 || next < 0 || next >= state.printCollectionIds.length) return;
    var moved = state.printCollectionIds[index];
    state.printCollectionIds[index] = state.printCollectionIds[next];
    state.printCollectionIds[next] = moved;
    clearPrintResult_();
    renderPrint();
  }

  function setPrintStatus_(id, printed) {
    var item = byId(id);
    if (!item) return;
    google.script.run.withSuccessHandler(function (updated) {
      clearPrintResult_();
      var current = byId(updated.id);
      if (current) {
        current.printedAt = updated.printedAt;
        current.updated = updated.updated;
      }
      renderManageList();
      say(printed ? 'Frase marcada como incluida.' : 'Marca de material quitada.');
    }).withFailureHandler(function (err) {
      renderManageList();
      say(err.message, 'err');
    }).setPhrasePrinted({ id:id, printed:printed, expectedUpdated:item.updated });
  }

  function printPayload_() {
    return {
      scope:state.printScope,
      collectionIds:state.printCollectionIds.slice(),
      onlyUnprinted:state.printOnlyUnprinted,
      order:state.printOrder,
      fontSize:state.printFontSize,
      lineHeight:state.printLineHeight,
      previewSignature:state.printFormat === 'html' && state.printPreview ? state.printPreview.signature || '' : ''
    };
  }

  function previewPrintMaterial_() {
    var estimate = printEstimate_();
    if (!estimate.unique || state.printGenerating || state.printPreviewLoading) return;
    clearPrintDownload_();
    var revision = state.printRevision;
    state.printPreviewLoading = true;
    renderPrint();
    google.script.run.withSuccessHandler(function (result) {
      if (revision !== state.printRevision) return;
      state.printPreviewLoading = false;
      state.printPreview = {body:result.body, includedCount:result.includedCount, rowCount:result.rowCount, name:result.name, signature:result.signature};
      render();
    }).withFailureHandler(function (err) {
      if (revision !== state.printRevision) return;
      state.printPreviewLoading = false;
      render();
      say(err.message, 'err');
    }).previewPhraseMaterial(printPayload_());
  }

  function replaceMaterialBody_(document, body) {
    var start = document.indexOf('<body');
    var openEnd = document.indexOf('>', start);
    var close = document.lastIndexOf('</body>');
    return start === -1 || openEnd === -1 || close === -1 ? document : document.slice(0, openEnd + 1) + body + document.slice(close);
  }

  function generatePrintMaterial_() {
    var estimate = printEstimate_();
    if (!estimate.unique || state.printGenerating) return;
    capturePrintPreview_();
    var format = state.printFormat;
    var editedBody = format === 'html' && state.printPreview ? state.printPreview.body : null;
    var payload = printPayload_();
    state.printGenerating = true;
    clearPrintDownload_();
    state.printRevision++;
    var revision = state.printRevision;
    renderPrint();
    var method = format === 'html' ? 'generatePhraseHtml' : 'generatePhraseMarkdown';
    var mime = format === 'html' ? 'text/html;charset=utf-8' : 'text/markdown;charset=utf-8';
    google.script.run.withSuccessHandler(function (result) {
      var useEditedBody = format === 'html' && editedBody !== null && revision === state.printRevision;
      var content = useEditedBody ? replaceMaterialBody_(result.content, editedBody) : result.content;
      var blob = new Blob([content], {type:mime});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = result.name;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      state.printGenerating = false;
      state.printPreview = format === 'html' && revision === state.printRevision ? {body:useEditedBody ? editedBody : result.body, includedCount:result.includedCount, rowCount:result.rowCount, name:result.name, signature:result.signature} : null;
      state.printResult = {url:url, name:result.name, includedCount:result.includedCount, rowCount:result.rowCount, markedAt:result.markedAt};
      render();
      reload(function () {
        render();
        say('Material descargado y frases marcadas.');
      }, true);
    }).withFailureHandler(function (err) {
      state.printGenerating = false;
      render();
      say(err.message, 'err');
    })[method](payload);
  }

  function collectionCatalogHtml() {
    if (!state.collectionsLoaded) return '<div class="empty">Cargando colecciones…</div>';
    var query = String(state.collectionQuery || '').toLowerCase();
    var collections = [{ id:ALL_COLLECTION_ID, name:'Todas', count:state.items.length, all:true }].concat(state.collections).filter(function (collection) {
      return !query || collection.name.toLowerCase().indexOf(query) !== -1;
    });

      '<input id="collection-search" type="search" placeholder="Buscar colecciones…" value="' + esc(state.collectionQuery) + '"><div class="card collection-list" style="margin-top:12px">' +
      (rows || '<div class="empty">No hay colecciones que coincidan.</div>') + '</div></section>';

  function sessionRowHtml_(item, index) {
    var current = index === player.index;
    var german = germanVisible_(index);
    var spanish = state.session.supports.spanish;
    var text = '';
    if (german) text += '<span class="session-row-de">' + esc(item.de) + '</span>';

    } else if (current) {
      action = '<button class="session-row-play" data-act="player-row-toggle" data-index="' + index + '"' + (player.voice ? '' : ' disabled') + '>' + (player.playing ? 'Pausar' : 'Reproducir') + '</button>';
    }

      '<div class="session-control-body"><div class="field"><label for="session-phase">Fase</label><select id="session-phase">' + phaseOptions + '</select></div><div class="field"><label for="session-order">Orden</label><select id="session-order"><option value="manual"' + (state.session.order === 'manual' ? ' selected' : '') + '>Manual</option><option value="random"' + (state.session.order === 'random' ? ' selected' : '') + '>Aleatorio</option></select></div>' +

  }

      return '<section class="card collection-player"><button class="link" data-act="collection-back">← Volver a colecciones</button><h1 class="section-title" style="margin-top:14px">' + esc(collection.collection.name) + '</h1><div class="empty">Esta colección no tiene frases.</div>' +

      (collection.collection.unassigned || collection.collection.all ? '' : '<span><button class="link" data-act="new-collection-phrase">Nueva frase</button><button class="link" data-act="edit-collection">Editar colección</button></span>') + '</div><h1 class="section-title">' + esc(collection.collection.name) + '</h1>' +

    var current = {};
    (state.collection && state.collection.items || []).forEach(function (item) { current[item.id] = true; });

    if (state.collectionEditor === 'new') {
      return '<section class="panel form-panel" style="max-width:620px"><div class="section-head"><h1 class="section-title">Nueva colección</h1></div><div class="field"><label for="collection-name">Nombre</label><input id="collection-name" type="text" placeholder="Por ejemplo: Mi trabajo"></div><div class="form-actions"><button class="primary" data-act="save-collection">Crear colección</button><button class="ghost" data-act="cancel-collection-editor">Cancelar</button></div></section>';

    var members = memberPage.items.map(function (item, index) {
