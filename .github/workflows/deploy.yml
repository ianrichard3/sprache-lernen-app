name: Sync Apps Script

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check copied text format
        run: node test-copy-text.mjs
      - name: Check filtered phrase practice and SSML
        run: node test-study-flow.mjs
      - name: Check collections flow
        run: node test-collections-flow.mjs
      - name: Check print flow
        run: node test-print-flow.mjs
      - name: Check Gemini response parsing
        run: node test-ai-flow.mjs
      - name: Check language pairs and pronunciation
        run: node test-language-flow.mjs
      - name: Check client syntax
        run: node test-client-syntax.mjs
      - name: Check delayed responses and concurrent operations
        run: node test-race-flow.mjs
      - name: Push to Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          printf "const PRODUCTION_SPREADSHEET_ID = '%s';\n" '16iaAw1OpXNF2x2MHjEFVOLzGezdvI73XFDiqE56oQFU' > Production.gs
          npx --yes @google/clasp@3.3.0 show-file-status
          npx --yes @google/clasp@3.3.0 push --force
          npx --yes @google/clasp@3.3.0 create-deployment \
            --deploymentId AKfycbzev-d6D3ftvGW6afcHONQQgX4vs8h5fiTTejgNBVGjnHU2fKDXgno2uaQdUIb1AfEt \
            --description "GitHub ${GITHUB_SHA}"
